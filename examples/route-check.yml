# Check a route against the navigational warnings in force, in CI.
# Put this file in .github/workflows/ of a repository that holds a route file, add the key as the
# secret SEALAGOM_API_KEY, and the job fails when a warning of the chosen severity lies on the route.
name: Route check against SeaLagom warnings

on:
  schedule:
    - cron: "0 6 * * *"      # every morning, 06:00 UTC
  workflow_dispatch:
  push:
    paths: ["routes/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send the route, read the answer
        env:
          SEALAGOM_API_KEY: ${{ secrets.SEALAGOM_API_KEY }}
          ROUTE_FILE: routes/passage.rtz          # RTZ, RT3, GPX, KML, CSV or NMEA
          CORRIDOR_NM: "15"
          FAIL_ON: "critical,high"                # severities that fail the job
        run: |
          set -e
          curl -sS -X POST https://www.sealagom.com/api/v2/route/ \
            -H "X-API-Token: $SEALAGOM_API_KEY" \
            -F "file=@$ROUTE_FILE" -F "corridor_nm=$CORRIDOR_NM" > result.json
          python3 - <<'PY'
          import json, os
          r = json.load(open("result.json"))
          if "detail" in r and "results" not in r:
              raise SystemExit("SeaLagom: " + r["detail"])
          print(f"{r['route_nm']} NM, NAVAREAs: " + ", ".join(z["name"] for z in r["navareas"]) + f", {r['count']} warnings on the route")
          fail = {s.strip() for s in os.environ["FAIL_ON"].split(",") if s.strip()}
          bad = []
          for w in r["results"]:
              ai = w.get("ai") or {}
              line = f"  {w['region_title']} {w['number']}  {w['distance_nm']} NM off at {w['along_nm']} NM  {w['verdict']}  {ai.get('severity','')}  {ai.get('headline','')}"
              print(line)
              if w["verdict"] in ("in_force", "upcoming") and ai.get("severity") in fail:
                  bad.append(line)
          if bad:
              raise SystemExit(f"{len(bad)} warning(s) of severity {sorted(fail)} on the route")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealagom-route-check
          path: result.json
