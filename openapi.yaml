        "200":
          description: "{time, at: {...}, series: [...], ocean, source}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/route/convert/:
    post:
      operationId: convertRoute
      tags: [route]
      summary: "Route converter: any route file in, RTZ, GPX, KML, CSV or NMEA out"
      description: |
        JSON waypoints in, the route in another format out. A route file goes to convertRouteFile (POST
        /api/v2/route/convert/file/, multipart); this address takes a multipart file too, for curl and older clients,
        but a generated client sends JSON here. `to` may also be given in the body. The answer is always a file (a
        stream, so every generated client reads it as bytes): the converted route with Content-Disposition attachment
        and the header X-Waypoints, or with to=json a JSON text {name, waypoints: [{lat, lon, name, legType}], count}
        to parse yourself.
      parameters:
        - name: to
          in: query
          description: The output format (default gpx). It may also be sent in the body.
          schema: { $ref: "#/components/schemas/RouteFormat" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteConvertRequest" }
      responses:
        "200":
          description: "The converted route as a file: RTZ (application/xml), GPX, KML, CSV, NMEA (text/plain), or JSON with to=json"
          content:
            application/json:
              schema: { type: string, format: binary }
            application/xml:
              schema: { type: string, format: binary }
            application/gpx+xml:
              schema: { type: string, format: binary }
            application/vnd.google-earth.kml+xml:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /api/v2/route/convert/file/:
    post:
      operationId: convertRouteFile
      tags: [route]
      summary: "Route converter for a file: any route file in, RTZ, GPX, KML, CSV or NMEA out"
      description: |
        The converter of POST /api/v2/route/convert/ for a route file: multipart field `file` (RTZ, RT3, GPX, KML,
        CSV, NMEA and more, up to 5 MB). The answer is the same file stream (with to=json a JSON text {name, waypoints,
        count}).
      parameters:
        - name: to
          in: query
          description: The output format (default gpx).
          schema: { $ref: "#/components/schemas/RouteFormat" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RouteConvertUpload" }
      responses:
        "200":
          description: "The converted route as a file: RTZ (application/xml), GPX, KML, CSV, NMEA (text/plain), or JSON with to=json"
          content:
            application/json:
              schema: { type: string, format: binary }
            application/xml:
              schema: { type: string, format: binary }
            application/gpx+xml:
              schema: { type: string, format: binary }
            application/vnd.google-earth.kml+xml:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /api/v2/sky/link/:
    get:
      operationId: getSkyLink
      tags: [sky]
      summary: A ready link into the sky view for a ship, a warning, a port, a place or a position
      description: |
        Give one of: vessel (name), mmsi or imo (aboard=1 for the view from her bridge); warning (number) with region
        (NAVAREA XII or a coastal country), or q (words of a warning in force); port (name, country to narrow) or locode;
        place (a well-known place; lat and lon when it is not on the list); lat and lon (a position). The view stands
        where the target can be seen: a ship 1 nm off her starboard beam looking at her (aboard: on her bridge looking
        ahead), a warning 1 nm off its position or just outside the edge of its area at sea (0.4 nm) looking in, a port off
        its approach looking in. Ships come from the live AIS feed (reports of the last 30 minutes), placed where she is
        now (her report carried forward on her course, at most 15 minutes); below Contributor a key sees the same half of
        the ships as the free map (403 for the other half). The link is signed (sig=): anyone may open it, at no cost to
        their own allowance. Nothing is stored. Not for navigation.
      parameters:
        - { name: vessel, in: query, schema: { type: string } }
        - { name: mmsi, in: query, schema: { type: string, pattern: "^[0-9]{9}$" } }
        - { name: imo, in: query, schema: { type: string, pattern: "^[0-9]{7}$" } }
        - name: aboard
          in: query
          description: "true (or 1, yes): the view from her bridge."
          schema: { type: boolean }
        - { name: warning, in: query, schema: { type: string }, description: "The warning's number, e.g. 123/26" }
        - { name: region, in: query, schema: { type: string }, description: "NAVAREA XII, or a coastal country" }
        - { name: q, in: query, schema: { type: string }, description: "Words of a warning in force" }
        - { name: port, in: query, schema: { type: string } }
        - { name: locode, in: query, schema: { type: string }, description: "UN/LOCODE, e.g. SGSIN" }
        - { name: country, in: query, schema: { type: string } }
        - { name: place, in: query, schema: { type: string }, description: "A well-known place, e.g. Cape Horn" }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: look, in: query, schema: { type: number, minimum: 0, maximum: 360 }, description: "A position's bearing to look along (ignored when not a number from 0 to 360)" }
      responses:
        "200":
          description: |
            {url (absolute), path, at: {lat, lon}, look: {az, alt, fov}, focus ("ship:<MMSI>", "warning:<scope>:<id>",
            "port:<slug>" or null), aboard, target: {kind: vessel|warning|port|place|position, title, lat, lon,
            approximate}, how, note: "Not for navigation."}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Several match (two ships of one name, two warnings of one number, two positions): {detail, choices: [..]}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v2/sky/route/:
    post:
      operationId: createSkyRouteLink
      tags: [sky, route]
      summary: "A route in: its sky link (standing on the first waypoint, the route drawn on the sea) and RTZ and GPX out"
      description: |
        Read with the map's own parsers (RTZ, RT3, GPX, KML, CSV, NMEA and more; 2 MB, 500 waypoints) or from JSON.
        Legs are rhumb lines unless the file or leg_types marks a great circle (also an RTZ defaultWaypoint's leg). An
        RTZ's plan is kept: each waypoint's turn radius, each leg's cross-track limits, and the schedule (planned speeds
        from scheduleElement speed, calculated before manual, never speedMin or speedMax; the file's ETD and ETAs win;
        time added up leg by leg). The sky link carries routes of up to 200 waypoints (route_in_link). rtz is RTZ 1.1
        with the great-circle legs, radii, XTDs and planned speeds kept, gpx a GPX 1.1 route. Nothing is stored. Not for
        navigation. A route file goes to createSkyRouteLinkFromFile (POST /api/v2/sky/route/file/, multipart); this
        address takes a multipart file too, for curl and older clients, but a generated client sends JSON here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkyRouteRequest" }
      responses:
        "200":
          description: |
            {name, waypoints: [{lat, lon, name, radius_nm?}], leg_types: [RL|GC] | null, distance_nm,
            legs: [{course, distance_nm, type, speed_kn?, hours?, xtd_port_nm?, xtd_stbd_nm?}],
            speed_kn (the whole distance over the whole planned time, when every leg is timed) | null, etd (ISO) | null,
            sky_url, route_in_link, rtz (text), gpx (text), note}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /api/v2/sky/route/file/:
    post:
      operationId: createSkyRouteLinkFromFile
      tags: [sky, route]
      summary: "A route file in: its sky link and RTZ and GPX out"
      description: |
        The call of POST /api/v2/sky/route/ for a route file: multipart field `file` (RTZ, RT3, GPX, KML, CSV, NMEA
        and more the map reads; 2 MB, 500 waypoints). The same answer. Nothing is stored. Not for navigation.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: "The same answer as POST /api/v2/sky/route/: {name, waypoints, leg_types, distance_nm, legs, speed_kn, etd, sky_url, route_in_link, rtz, gpx, note}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /api/v2/near/:
    get:
      operationId: listWarningsNear
      tags: [lookups]
      summary: Warnings in force near a position, with distance and bearing
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - name: radius_nm
