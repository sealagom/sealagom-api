    IceType:
      type: string
      enum: [iceberg, sea_ice, ice_edge, icing, ice_report, icebreaker, ice_navigation, other_ice]
    RouteFormat:
      type: string
      enum: [rtz, gpx, kml, csv, nmea, json]
      default: gpx
    LegType:
      type: string
      enum: [RL, GC]
    OffSwitch:
      type: string
      description: "off switches the saved setting off for one call"
      enum: ["off"]
    PortSort:
      type: string
      enum: [rank]
    SpaceGroup:
      type: string
      enum: [bright, stations, recent, rocket, debris]
    ReportKind:
      type: string
      default: noon
      enum: [noon, departure, arrival, position, bunkering, cargo, eosp, sosp, anchoring, drifting, berthing, unberthing, shifting, canal, deviation, stoppage, offhire, onhire, prearrival, weather, ballast, custom]
