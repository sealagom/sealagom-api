openapi: 3.1.0
info:
  title: SeaLagom API
  version: "2"
  summary: Navigational warnings of the whole world, with positions, shapes and an analysis of every warning.
  description: |
    NAVAREA and coastal navigational warnings as issued by the authorities, received around the clock.
    Authentication is the `X-API-Token` header. Free keys get the Developer allowance on active
    warnings; archives, the analysis object, geo features, feeds and full route checks come with the
    paid plans (https://www.sealagom.com/api/docs/#subscription-plans). Every response carries
    `X-API-Tokens-Used` and `X-API-Tokens-Remaining`; unknown parameter names are listed in
    `X-API-Unknown-Params`. The warnings are the authority: the analysis is machine-made and can be wrong.
  contact:
    email: contact@sealagom.com
  termsOfService: https://www.sealagom.com/terms/
servers:
  - url: https://www.sealagom.com
security:
  - apiToken: []
tags:
  - name: warnings
  - name: regions
  - name: feeds
  - name: route
  - name: noon
    description: Noon reports, vessels, voyages and weather. The same key; plan limits per account.
  - name: lookups
    description: Ports, stations, vessels and MMSI, rigs, zones, lights, stats. The same key, one request each.
  - name: public
    description: No key needed.
paths:
  /api/v2/messages/:
    get:
      tags: [warnings]
      summary: Warnings, filtered and paged
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [navarea, coastal, all] } }
        - { name: navarea_id, in: query, description: One or more NAVAREA ids (repeat or comma-separate), schema: { type: string } }
        - { name: coastal_id, in: query, schema: { type: string } }
        - { name: country, in: query, description: Country name, partial match, schema: { type: string } }
        - { name: q, in: query, description: Words in the warning text (original or English), schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: keyword, in: query, description: Keyword category or any word; repeat for several, schema: { type: string } }
        - { name: has_coordinates, in: query, schema: { type: boolean } }
        - { name: include_locals, in: query, description: French local (AVURNAV) warnings too, schema: { type: boolean } }
        - { name: include_archived, in: query, description: Paid API, schema: { type: boolean } }
        - { name: only_archived, in: query, description: Paid API, schema: { type: boolean } }
        - { name: include_coordinates, in: query, description: Paid API, schema: { type: boolean } }
        - { name: include_enhanced_coordinates, in: query, description: Full API, schema: { type: boolean } }
        - { name: include_keywords, in: query, description: Full API, schema: { type: boolean } }
        - { name: include_geo_features, in: query, description: Full API, schema: { type: boolean } }
        - { name: include_ai_analysis, in: query, description: Full API, schema: { type: boolean } }
        - { name: ai_severity, in: query, description: critical, high, moderate, low, info; repeat for several, schema: { type: string } }
        - { name: ai_category, in: query, schema: { type: string } }
        - { name: ai_status, in: query, schema: { type: string } }
        - { name: ai_in_force, in: query, description: Only warnings in force right now, schema: { type: boolean } }
        - { name: expires_within_hours, in: query, schema: { type: integer } }
        - { name: expires_after, in: query, schema: { type: string } }
        - { name: expires_before, in: query, schema: { type: string } }
        - { name: exclude_routine, in: query, description: Leave out ice reports, rig lists, in-force lists, schema: { type: boolean } }
        - { name: ai_has, in: query, schema: { type: string } }
        - { name: min_keep_clear_nm, in: query, schema: { type: number } }
        - { name: topic, in: query, description: A feed, ice or a themed feed slug, schema: { type: string } }
        - { name: ice_type, in: query, schema: { type: string } }
        - { name: settings, in: query, description: "off: ignore the key's saved settings for one call", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: A page of warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarningPage" }
        "401": { description: Missing or wrong key }
        "403": { description: The plan does not include this (include_all, include_archived on the free plan) }
        "429": { description: Allowance or rate limit reached }
  /api/v2/navarea/:
    get:
      tags: [regions]
      summary: NAVAREA regions, with their warnings on request
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: include_messages, in: query, schema: { type: boolean } }
        - { name: include_all, in: query, description: Paid API, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: A page of regions, content: { application/json: { schema: { $ref: "#/components/schemas/RegionPage" } } } }
  /api/v2/navarea/{id}/:
    get:
      tags: [regions]
      summary: One NAVAREA
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: The region, content: { application/json: { schema: { $ref: "#/components/schemas/Region" } } } }
  /api/v2/coastal/:
    get:
      tags: [regions]
      summary: Coastal regions (by country), with their warnings on request
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: include_messages, in: query, schema: { type: boolean } }
        - { name: include_locals, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: A page of regions, content: { application/json: { schema: { $ref: "#/components/schemas/RegionPage" } } } }
  /api/v2/coastal/{id}/:
    get:
      tags: [regions]
      summary: One coastal region
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: The region, content: { application/json: { schema: { $ref: "#/components/schemas/Region" } } } }
  /api/v2/ice/:
    get:
      tags: [feeds]
      summary: The ice feed (Full API)
      parameters:
        - { name: ice_type, in: query, schema: { type: string } }
        - { name: output, in: query, schema: { type: string, enum: [json, geojson] } }
      responses:
        "200": { description: Warnings about ice, content: { application/json: { schema: { $ref: "#/components/schemas/WarningPage" } } } }
  /api/v2/feeds/:
    get:
      tags: [feeds, public]
      summary: Every feed with its endpoint and the number of warnings in force
      security: []
      responses:
        "200": { description: The catalogue }
  /api/v2/feeds/{slug}/:
    get:
      tags: [feeds]
      summary: A themed feed (military, cables, offshore...) (Full API)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: output, in: query, schema: { type: string, enum: [json, geojson] } }
      responses:
        "200": { description: The feed's warnings, content: { application/json: { schema: { $ref: "#/components/schemas/WarningPage" } } } }
  /api/v2/route/:
    post:
      tags: [route]
      summary: Send a route, get the NAVAREAs it crosses and the warnings along it
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: RTZ, RT3, GPX, KML, CSV or NMEA route file (up to 5 MB) }
                corridor_nm: { type: number, default: 10 }
                speed_kn: { type: number, default: 12 }
                departure: { type: string, format: date-time }
          application/json:
            schema: { $ref: "#/components/schemas/RouteRequest" }
      responses:
        "200": { description: The route result, content: { application/json: { schema: { $ref: "#/components/schemas/RouteResult" } } } }
        "400": { description: The file could not be read, or fewer than two waypoints }
  /api/v2/drop/{token}/route/:
    post:
      tags: [route]
      summary: The same route check with the key in the address (a drop link for tools that can only POST a file)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                corridor_nm: { type: number }
      responses:
        "200": { description: The route result, content: { application/json: { schema: { $ref: "#/components/schemas/RouteResult" } } } }
  /api/map/account/:
    get:
      tags: [noon]
      summary: "The account of the key: vessels, voyages, fleets, invitations, plan usage"
      responses:
        "200": { description: The account }
  /api/map/vessels/:
    get:
      tags: [noon]
      summary: Your vessels (and the ones shared with you)
      responses:
        "200": { description: "{vessels: [...]}" }
    post:
      tags: [noon]
      summary: Add a vessel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                imo: { type: string }
                mmsi: { type: string }
                call_sign: { type: string }
                flag: { type: string }
                vessel_type: { type: string }
                fleet: { type: integer, description: fleet id, optional }
      responses:
        "201": { description: The vessel, with public_id }
  /api/map/vessels/{public_id}/voyages/:
    get:
      tags: [noon]
      summary: The voyages of a vessel
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{voyages: [...]}" }
    post:
      tags: [noon]
      summary: Open a voyage
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                number: { type: string }
                name: { type: string }
                departure_name: { type: string, description: port name or slug }
                arrival_name: { type: string }
                charterer: { type: string }
                etd: { type: string, format: date-time }
                eta: { type: string, format: date-time }
                waypoints: { type: array, items: { type: object, properties: { lat: { type: number }, lon: { type: number } } }, description: the planned route, optional }
      responses:
        "201": { description: The voyage, with public_id }
  /api/map/voyages/{public_id}/:
    get:
      tags: [noon]
      summary: One voyage with its dashboard figures
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The voyage }
  /api/map/voyages/{public_id}/reports/:
    get:
      tags: [noon]
      summary: The reports of a voyage (noon, departure, arrival, position, bunkering...)
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{reports: [...]}" }
    post:
      tags: [noon]
      summary: Post a report (a bridge PC, a GPS logger, a script)
      description: |
        The figures go in `values` under the vessel's report item keys (the report form at
        /report-form/ lists them: speed, distance, rpm, fuel and so on). A report of the same kind and
        time replaces the earlier one. When the figures do not add up the answer is 409 with `checks`;
        send `confirm: true` to save anyway.
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, default: noon, enum: [noon, departure, arrival, position, bunkering, cargo, eosp, sosp, anchoring, drifting, berthing, unberthing, shifting, canal, deviation, stoppage] }
                reported_at: { type: string, format: date-time, description: UTC; default now }
                lat: { type: number }
                lon: { type: number }
                values: { type: object, additionalProperties: true }
                confirm: { type: boolean }
      responses:
        "201": { description: The report with the computed figures }
        "402": { description: The report allowance of the plan is used up }
        "409": { description: Figures to check; confirm to save }
  /api/map/voyages/{public_id}/report-form/:
    get:
      tags: [noon]
      summary: The report items (keys, labels, units) this vessel expects
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The form definition }
  /api/map/voyages/{public_id}/weather-track/:
    get:
      tags: [noon]
      summary: The weather along the voyage's reported track
      parameters: [{ name: public_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Weather per report position and time }
  /api/map/weather/:
    get:
      tags: [noon]
      summary: Wind, sea and the forecast at a position and time
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - { name: time, in: query, schema: { type: string, format: date-time, description: UTC; default now } }
      responses:
        "200": { description: "{time, at: {...}, series: [...], ocean, source}" }
  /api/v2/route/convert/:
    post:
      tags: [route]
      summary: "Route converter: any route file in, RTZ, GPX, KML, CSV or NMEA out"
      parameters:
        - { name: to, in: query, required: true, schema: { type: string, enum: [rtz, gpx, kml, csv, nmea, json] } }
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary, description: "RTZ, RT3, GPX, KML, CSV or NMEA" } } }
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                waypoints: { type: array, items: { type: object, required: [lat, lon], properties: { lat: { type: number }, lon: { type: number }, name: { type: string } } } }
      responses:
        "200": { description: "The converted file (Content-Disposition attachment; header X-Waypoints)" }
  /api/v2/near/:
    get:
      tags: [lookups]
      summary: Warnings in force near a position, with distance and bearing
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - { name: radius_nm, in: query, schema: { type: number, default: 30, maximum: 200 } }
      responses:
        "200": { description: "{count, warnings: [...]}" }
  /api/v2/ports/:
    get:
      tags: [lookups]
      summary: Ports by name, UN/LOCODE or country, or the nearest to a position
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [rank] } }
        - { name: top, in: query, schema: { type: integer, enum: [1], description: the main ports only } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 40, maximum: 100 } }
      responses:
        "200": { description: "{ports: [{slug, name, country_code, un_locode, lat_decimal, lon_decimal, harbor_size, navarea_roman, rank}], total_count, page, total_pages}" }
  /api/v2/ports/{slug}/:
    get:
      tags: [lookups]
      summary: "One port: time zone, depths, approach and pilotage, VTS, anchorages, restrictions, facilities, warnings, routes"
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{port: {...}, warning_messages, attached_resources, related_resources, routes}" }
  /api/v2/port-distances/:
    get:
      tags: [lookups]
      summary: Sea distance between two ports along shared ECDIS routes
      parameters:
        - { name: from, in: query, schema: { type: string, description: port slug } }
        - { name: to, in: query, schema: { type: string } }
        - { name: port, in: query, schema: { type: string } }
      responses:
        "200": { description: Distances in NM }
  /api/v2/stations/:
    get:
      tags: [lookups]
      summary: Every rescue coordination centre and DSC coast station (NGA Pub 117), with MMSI
      responses:
        "200": { description: "{count, stations: [{id, kind, name, country, mmsi, lat, lon, bands, max_range_nm}]}" }
  /api/v2/stations/near/:
    get:
      tags: [lookups]
      summary: Rescue centres covering a position and DSC coast stations in range
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - { name: radius_nm, in: query, schema: { type: number, default: 200, maximum: 600 } }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 30 } }
      responses:
        "200": { description: "{rcc_covering, rcc_near, dsc_near, test_nearest}" }
  /api/v2/stations/{id}/:
    get:
      tags: [lookups]
      summary: One station with bands, watch times and contacts
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The station }
  /api/v2/vessels/:
    get:
      tags: [lookups]
      summary: "A vessel by name, call sign or MMSI: the warnings naming it, its rows, stations with that MMSI, live AIS when on"
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, description: "name, call sign or MMSI (3+ characters)" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: "{query, mmsi, vessels: [{name, mmsi, call_sign, imo, flag, type, warnings}], warnings: [{scope, region, region_id, number, in_force, added_on, url, vessels, headline*, severity*, status*, mariner_action*}], stations, ais, ais_live, count, meta?} (* Full API)" }
  /api/v2/vessels/{mmsi}/:
    get:
      tags: [lookups]
      summary: The same for one MMSI
      parameters:
        - { name: mmsi, in: path, required: true, schema: { type: string, description: 7 to 9 digits, leading zeros kept (coast stations start with 00) } }
      responses:
        "200": { description: As /api/v2/vessels/ }
  /api/v2/rigs/:
    get:
      tags: [lookups]
      summary: Mobile offshore drilling units with their last reported positions
      responses:
        "200": { description: "{count, rigs: [...]}" }
  /api/v2/zones/:
    get:
      tags: [lookups]
      summary: Nautical time zones and satcom footprints
      responses:
        "200": { description: "{zones, satcom}" }
  /api/v2/navarea-zones/:
    get:
      tags: [lookups]
      summary: The 21 NAVAREAs as GeoJSON (limits from WMO-No. 558), with coordinator and warnings in force
      responses:
        "200": { description: A GeoJSON FeatureCollection }
  /api/v2/lights/:
    get:
      tags: [lookups]
      summary: Aids to navigation reported out of order (Full API; other plans get count and locked=true)
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [navarea, coastal] } }
        - { name: region_id, in: query, schema: { type: integer } }
        - { name: country, in: query, schema: { type: string } }
      responses:
        "200": { description: "{count, conditions, locked, regions, aids}" }
  /api/v2/stats/:
    get:
      tags: [lookups]
      summary: The public figures of the service
      responses:
        "200": { description: The figures }
  /feeds/warnings.xml:
    get:
      tags: [public]
      summary: RSS of the newest 100 warnings (also /feeds/navarea/{id}.xml and /feeds/coastal/{id}.xml)
      security: []
      responses:
        "200": { description: RSS 2.0, content: { application/rss+xml: {} } }
  /feeds/warnings.txt:
    get:
      tags: [public]
      summary: The newest warnings as plain text (?navarea=, ?coastal=, ?limit=)
      security: []
      responses:
        "200": { description: text/plain }
components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-API-Token
  schemas:
    WarningPage:
      type: object
      properties:
        count: { type: integer, description: Warnings matching the request, all pages }
        page: { type: integer }
        page_size: { type: integer }
        next: { type: [string, "null"], format: uri }
        previous: { type: [string, "null"], format: uri }
        results:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        meta:
          type: object
          properties:
            warnings: { type: array, items: { type: string }, description: Features left out for the plan, ignored filters }
            prompt_filter: { type: object }
            topic: { type: object }
    Warning:
      $ref: "./models/warning.schema.json"
    Analysis:
      $ref: "./models/analysis.schema.json"
    RouteRequest:
      type: object
      required: [waypoints]
      properties:
        waypoints:
          type: array
          minItems: 2
          items:
            type: object
            required: [lat, lon]
            properties:
              lat: { type: number, minimum: -90, maximum: 90 }
              lon: { type: number, minimum: -180, maximum: 180 }
        speed_kn: { type: number, default: 12 }
        corridor_nm: { type: number, default: 10 }
        departure: { type: string, format: date-time, description: UTC; default now }
    RouteResult:
      $ref: "./models/route-result.schema.json"
    Region:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        sub_title: { type: string, description: Coastal regions only }
        country: { type: string }
        time_upd: { type: string, format: date-time }
        active_messages: { type: array, items: { $ref: "#/components/schemas/Warning" } }
        archived_messages: { type: array, items: { $ref: "#/components/schemas/Warning" } }
    RegionPage:
      type: object
      properties:
        count: { type: integer }
        next: { type: [string, "null"] }
        previous: { type: [string, "null"] }
        results: { type: array, items: { $ref: "#/components/schemas/Region" } }
