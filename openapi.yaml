    post:
      operationId: checkRouteFile
      tags: [route]
      summary: Send a route file, get the NAVAREAs it crosses and the warnings along it
      description: |
        The route check of POST /api/v2/route/ for a route file: multipart field `file` (RTZ, RT3, GPX, KML, CSV,
        NMEA and more, up to 5 MB), with corridor_nm, speed_kn and departure as form fields. The same answer, plans
