openapi: 3.1.0
info:
  title: SeaLagom API
  version: "2"
  summary: Navigational warnings of the whole world, with positions, shapes and an analysis of every warning.
  description: |
    NAVAREA and coastal navigational warnings as issued by the authorities, received around the clock.
    Authentication: `X-API-Token: <key>` or `Authorization: Bearer <key>`. No key at all is the free tier, keyed on
    the caller's address: 100 calls a day, at most 50 warnings a call, for 3 days from the first call or 300 calls,
    whichever comes first (an account without an API plan gets the same tier on the account, never both added; the
    GitHub Developer allowance keeps its own requests). The free tier reads active warnings; archived warnings come
    with a paid API plan (API Default or Full API). Free answers carry
    `X-Free-Tier-Calls-Remaining-Today`, `X-Free-Tier-Calls-Remaining-Total`, `X-Free-Tier-Records-Per-Call` and
    `X-Free-Tier-Ends`; when a quota is used the answer is HTTP 402 with what was used, when it starts again
    (`free_tier.resets_at`) and the links to pay at once (`pay.checkout`, `pay.crypto`, `pay.agent_checkout`). The
    archive in bulk, the analysis object, geo features, feeds and full route checks come with the paid plans
    (https://www.sealagom.com/api/docs/#subscription-plans). Answers to the warning and region calls carry
    `X-API-Records-Returned` and `X-API-Tokens-Used`, and on a paid plan `X-API-Tokens-Remaining` (unlimited on the
    plans without a request count). Unknown parameter names are not refused; the per region messages calls list them
    in `meta.warnings`. A key's saved settings (Profile, API) apply to every /api/v2/ call made with it;
    `settings=off` ignores them for one call. The warnings are the authority: the analysis is machine-made and can be
    wrong.

    Boolean query parameters: send the lower case word `true`. The region calls (/api/v2/navarea/ and
    /api/v2/coastal/), include_geo_features and include_ai_analysis read only that exact value; the other switches of
    /api/v2/messages/ also read 1 and yes.

    Client generators (NSwag, openapi-generator, openapi-typescript and others) work from this file as it is: every
    operation takes one kind of body and answers one shape. A route file goes to the /file/ operations
    (checkRouteFile, convertRouteFile, createSkyRouteLinkFromFile), the feeds as GeoJSON come from the /geojson/
    operations, and the route converter and the RSS feed answer a file stream. Times in the query without a zone are
    read as UTC. NSwag writes date-time query values without their offset by default, so pass UTC values or set its
    parameterDateTimeFormat to yyyy-MM-ddTHH:mm:sszzz, which keeps the offset.

    Paid features in one place: route analysis (POST /api/v2/route/ with an RTZ, RT3, GPX, KML, CSV or NMEA
    file: the NAVAREAs the route crosses and every warning along it, timed from your speed and departure),
    port time zones with the UTC offset now and the next DST start and end (kept current automatically),
    the archive in bulk, the analysis of every warning, geo features (GeoJSON, KML, Shapefile and more) and feeds.
    This spec: https://www.sealagom.com/openapi.json (or .yaml), OpenAPI 3.1 and self-contained (no external
    references). The same document as OpenAPI 3.0.3, made from it when served, for tools that read only 3.0
    (AutoRest, Azure API Management, Swagger Codegen, older NSwag): https://www.sealagom.com/openapi-3.0.json
    (or .yaml). Code and an MCP server: https://github.com/sealagom/sealagom-api
  contact:
    email: contact@sealagom.com
  termsOfService: https://www.sealagom.com/terms/
  license:
    name: Proprietary, see the terms of service
    url: https://www.sealagom.com/terms/
externalDocs:
  description: Plans and prices for the API
  url: https://www.sealagom.com/api/docs/#subscription-plans
servers:
  - url: https://www.sealagom.com
security:
  - apiToken: []
  - bearerAuth: []
  - {}
tags:
  - name: warnings
    description: Warnings in one flat list across every NAVAREA and coastal region, with filters and paging.
  - name: regions
    description: NAVAREA and coastal regions, each with its warnings in force and archived warnings on request.
  - name: feeds
    description: The ice feed and the themed feeds (military, space, cables and more). Full API.
  - name: route
    description: Route checks and the route converter.
  - name: noon
    description: Noon reports, vessels, voyages and weather. The same key; plan limits per account.
  - name: lookups
    description: Ports, stations, vessels and MMSI, rigs, zones, lights, stats. The same key, one request each.
  - name: sky
    description: Ready links into the sky view (the real sky and sea around a position) for a ship, a warning, a port, a place or a route. Not for navigation.
  - name: fleet
    description: Your own vessels pushed in by API or a signed webhook, live in your sky and map only, with status, ETA, warnings near and along the route. Not for navigation.
  - name: public
    description: No key needed.
paths:
  /api/v2/messages/:
    get:
      operationId: listMessages
      tags: [warnings]
      summary: Warnings, filtered and paged
      description: |
        One flat list of warnings across every NAVAREA and coastal region, newest first. NAVTEX feed regions
        (type NAVTEX_FEED) are never in it, except with topic=ice; local regions (type LOCAL) only with
        include_locals=true. Filters on the analysis, topic, prompt_filter and the enhanced coordinates need the Full API
        plan; on other plans they are ignored and meta.warnings says so (topic answers 403).
      parameters:
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/NavareaIds"
        - $ref: "#/components/parameters/CoastalIds"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/IncludeLocals"
        - $ref: "#/components/parameters/IncludeArchived"
        - $ref: "#/components/parameters/OnlyArchived"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/MessageClass"
        - $ref: "#/components/parameters/Station"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusNm"
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/IncludeCoordinates"
        - $ref: "#/components/parameters/IncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeKeywords"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/AiSeverity"
        - $ref: "#/components/parameters/AiCategory"
        - $ref: "#/components/parameters/AiStatus"
        - $ref: "#/components/parameters/AiInForce"
        - $ref: "#/components/parameters/ExpiresWithinHours"
        - $ref: "#/components/parameters/ExpiresAfter"
        - $ref: "#/components/parameters/ExpiresBefore"
        - $ref: "#/components/parameters/ExcludeRoutine"
        - $ref: "#/components/parameters/AiHas"
        - $ref: "#/components/parameters/MinKeepClearNm"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/IceType"
        - $ref: "#/components/parameters/FeedCategory"
        - $ref: "#/components/parameters/PromptFilter"
        - $ref: "#/components/parameters/Settings"
        - $ref: "#/components/parameters/Preset"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/MessagesPageSize"
      responses:
        "200":
          description: A page of warnings
          headers:
            X-API-Records-Returned: { $ref: "#/components/headers/RecordsReturned" }
            X-API-Tokens-Used: { $ref: "#/components/headers/TokensUsed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarningPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/navarea/:
    get:
      operationId: listNavareas
      tags: [regions]
      summary: NAVAREA regions, with their warnings on request
      description: |
        The 21 NAVAREAs as regions. Each region carries its warnings in force (active_messages) with
        include_messages=true and its archived warnings (archived_messages) with include_archived=true; both lists are
        empty otherwise. The warnings inside a region are capped by the plan's batch (on the free tier 50 in all on the
        page, then meta.free_tier.trimmed is true); include_all=true lifts the cap on the paid plans. Every switch reads
        only the exact value true.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/RegionCountry"
        - $ref: "#/components/parameters/RegionType"
        - $ref: "#/components/parameters/RegionTimeFrom"
        - $ref: "#/components/parameters/RegionTimeTo"
        - $ref: "#/components/parameters/RegionTitleSearch"
        - $ref: "#/components/parameters/RegionContentSearch"
        - $ref: "#/components/parameters/IncludeMessages"
        - $ref: "#/components/parameters/RegionIncludeArchived"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/RegionIncludeKeywords"
        - $ref: "#/components/parameters/RegionIncludeCoordinates"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/Settings"
        - $ref: "#/components/parameters/Preset"
        - $ref: "#/components/parameters/RegionPageNumber"
        - $ref: "#/components/parameters/RegionPageSize"
      responses:
        "200":
          description: A page of NAVAREA regions
          headers:
            X-API-Records-Returned: { $ref: "#/components/headers/RecordsReturned" }
            X-API-Tokens-Used: { $ref: "#/components/headers/TokensUsed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/navarea/{id}/:
    get:
      operationId: getNavarea
      tags: [regions]
      summary: One NAVAREA
      description: |
        The same region as in the list, with the same switches and warning filters. A region filter that does not
        match the id (country, type and the others) answers 404. Not paged and not trimmed by the free tier: at most
        one batch of warnings in each list.
      parameters:
        - $ref: "#/components/parameters/RegionPathId"
        - $ref: "#/components/parameters/RegionCountry"
        - $ref: "#/components/parameters/RegionType"
        - $ref: "#/components/parameters/RegionTimeFrom"
        - $ref: "#/components/parameters/RegionTimeTo"
        - $ref: "#/components/parameters/RegionTitleSearch"
        - $ref: "#/components/parameters/RegionContentSearch"
        - $ref: "#/components/parameters/IncludeMessages"
        - $ref: "#/components/parameters/RegionIncludeArchived"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/RegionIncludeKeywords"
        - $ref: "#/components/parameters/RegionIncludeCoordinates"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/Settings"
        - $ref: "#/components/parameters/Preset"
      responses:
        "200":
          description: The region
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Region" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/navarea/{id}/messages/:
    get:
      operationId: listNavareaMessages
      tags: [regions]
      summary: The warnings in force of one NAVAREA
      description: |
        The region's warnings in force as a flat list, one batch of the plan (include_all=true: every warning on
        the Full API plan, on other paid plans as many as the requests left allow; refused on the free tier).
        meta.source_status appears while the region's source is not answering.
      parameters:
        - $ref: "#/components/parameters/RegionPathId"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/Settings"
      responses:
        "200":
          description: The region's warnings in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionMessages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/navarea/{id}/archived_messages/:
    get:
      operationId: listNavareaArchivedMessages
      tags: [regions]
      summary: The archived warnings of one NAVAREA
      description: |
        Without a plan that has archived data this is the open archive: at most 50 archived warnings a request,
        newest archived first, by page or cursor, with the archive filters (status, category or message_class, station,
        dates, q, a position) and 30 archive questions a minute per address (a question with a position counts 5).
        While the archive is closed it answers 403 with the plan that opens it. A plan with archived data gets one
        batch of the plan (include_all=true: every one on the Full API plan) and the paging and archive filters are not
        read.
      parameters:
        - $ref: "#/components/parameters/RegionPathId"
        - $ref: "#/components/parameters/ArchivePage"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArchivePageSize"
        - $ref: "#/components/parameters/ArchiveStatus"
        - $ref: "#/components/parameters/ArchiveCategory"
        - $ref: "#/components/parameters/MessageClass"
        - $ref: "#/components/parameters/Station"
        - $ref: "#/components/parameters/IssuedFrom"
        - $ref: "#/components/parameters/IssuedTo"
        - $ref: "#/components/parameters/ArchiveDateFrom"
        - $ref: "#/components/parameters/ArchiveDateTo"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusNm"
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/Settings"
      responses:
        "200":
          description: The region's archived warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionArchivedMessages" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/coastal/:
    get:
      operationId: listCoastal
      tags: [regions]
      summary: Coastal regions (by country), with their warnings on request
      description: |
        Every coastal region: type COASTAL (national coastal warnings), LOCAL (local warnings such as the French
        AVURNAV and some national NAVTEX stations) and NAVTEX_FEED (the NAVTEX Live Feed areas, Area A to Area V). All three types
        are always listed; filter with type= to keep one. A licensed key (a client showing the data in its own product)
        never receives the NAVTEX_FEED regions. The switches and limits are those of /api/v2/navarea/.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/RegionCountry"
        - $ref: "#/components/parameters/RegionType"
        - $ref: "#/components/parameters/RegionTimeFrom"
        - $ref: "#/components/parameters/RegionTimeTo"
        - $ref: "#/components/parameters/RegionTitle"
        - $ref: "#/components/parameters/RegionSubTitle"
        - $ref: "#/components/parameters/RegionContentSearch"
        - $ref: "#/components/parameters/IncludeMessages"
        - $ref: "#/components/parameters/RegionIncludeArchived"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/RegionIncludeKeywords"
        - $ref: "#/components/parameters/RegionIncludeCoordinates"
        - $ref: "#/components/parameters/CoastalIncludeLocals"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/Settings"
        - $ref: "#/components/parameters/Preset"
        - $ref: "#/components/parameters/RegionPageNumber"
        - $ref: "#/components/parameters/RegionPageSize"
      responses:
        "200":
          description: A page of coastal regions
          headers:
            X-API-Records-Returned: { $ref: "#/components/headers/RecordsReturned" }
            X-API-Tokens-Used: { $ref: "#/components/headers/TokensUsed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/coastal/{id}/:
    get:
      operationId: getCoastal
      tags: [regions]
      summary: One coastal region
      description: The same region as in the list, with the same switches and warning filters (see /api/v2/navarea/{id}/).
      parameters:
        - $ref: "#/components/parameters/RegionPathId"
        - $ref: "#/components/parameters/RegionCountry"
        - $ref: "#/components/parameters/RegionType"
        - $ref: "#/components/parameters/RegionTimeFrom"
        - $ref: "#/components/parameters/RegionTimeTo"
        - $ref: "#/components/parameters/RegionTitle"
        - $ref: "#/components/parameters/RegionSubTitle"
        - $ref: "#/components/parameters/RegionContentSearch"
        - $ref: "#/components/parameters/IncludeMessages"
        - $ref: "#/components/parameters/RegionIncludeArchived"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/RegionIncludeKeywords"
        - $ref: "#/components/parameters/RegionIncludeCoordinates"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/Settings"
        - $ref: "#/components/parameters/Preset"
      responses:
        "200":
          description: The region
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Region" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/coastal/{id}/messages/:
    get:
      operationId: listCoastalMessages
      tags: [regions]
      summary: The warnings in force of one coastal region
      description: As /api/v2/navarea/{id}/messages/ for a coastal region.
      parameters:
        - $ref: "#/components/parameters/RegionPathId"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/Settings"
      responses:
        "200":
          description: The region's warnings in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionMessages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/coastal/{id}/archived_messages/:
    get:
      operationId: listCoastalArchivedMessages
      tags: [regions]
      summary: The archived warnings of one coastal region
      description: As /api/v2/navarea/{id}/archived_messages/ for a coastal region.
      parameters:
        - $ref: "#/components/parameters/RegionPathId"
        - $ref: "#/components/parameters/ArchivePage"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArchivePageSize"
        - $ref: "#/components/parameters/ArchiveStatus"
        - $ref: "#/components/parameters/ArchiveCategory"
        - $ref: "#/components/parameters/MessageClass"
        - $ref: "#/components/parameters/Station"
        - $ref: "#/components/parameters/IssuedFrom"
        - $ref: "#/components/parameters/IssuedTo"
        - $ref: "#/components/parameters/ArchiveDateFrom"
        - $ref: "#/components/parameters/ArchiveDateTo"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusNm"
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/HasCoordinates"
        - $ref: "#/components/parameters/IncludeAll"
        - $ref: "#/components/parameters/RegionIncludeEnhancedCoordinates"
        - $ref: "#/components/parameters/IncludeGeoFeatures"
        - $ref: "#/components/parameters/IncludeAiAnalysis"
        - $ref: "#/components/parameters/Settings"
      responses:
        "200":
          description: The region's archived warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionArchivedMessages" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/ice/:
    get:
      operationId: getIceFeed
      tags: [feeds]
      summary: The ice feed (Full API)
      description: |
        Every warning about ice (sorted by the analysis), NAVTEX ice reports and local warnings included. Takes every
        /api/v2/messages/ parameter except topic (always ice). include_coordinates, include_enhanced_coordinates,
        include_geo_features and include_ai_analysis are on unless the call sets them. Needs the Full API plan
        (403 otherwise). The same warnings as GeoJSON: getIceFeedGeojson (/api/v2/ice/geojson/). output=geojson on this
        address answers that FeatureCollection too, for older clients; a generated client calls getIceFeedGeojson,
        because this operation always reads a WarningPage.
      parameters:
