  /api/next-auth/github-connection/:
    get:
      operationId: getGithubConnection
      tags: [public]
      summary: Connect GitHub status (signed-in session). GET /auth/github/connect/?token_id= creates the route-check repository
      security: []
      responses:
        "200":
          description: "{enabled, authenticated, template, connection: {login, repo, url, last_run_url} or null, message}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
  /api/v2/fleet/positions/:
    post:
      operationId: pushFleetPositions
      tags: [fleet]
      summary: Push positions of your own vessels (a tracker, satellite AIS, the bridge); they show live in your sky and map only
      description: |
        One position, a list, or {"positions": [...]}, at most 500 a request (generated clients send the envelope;
        it holds one position as well as 500). A vessel is found by vessel_id (our id, or your own id for her), mmsi
        or imo, and added the first time with her name (the plan's number of vessels; 3 on the free trial, within the
        vessels your plan holds on SeaLagom). Other spellings providers use are read too (latitude, lng, sog, cog, hdg,
        timestamp, draft, loa, a GeoJSON Point). Refused with a plain reason each: no vessel named, a position out of
        range or 0, 0, no time, older than 24 hours or more than 5 minutes ahead, a speed over 80 knots, an impossible
        jump from the last position (over 60 knots), a second position within 10 seconds of the last, or one older
        than it. At most 120 requests a minute per account (pushes, reads of your vessels and route changes together)
        and a number of positions a day by the access, counting the positions kept (429 with Retry-After). These calls
        never use the requests of a data plan. Who may use it: the plans that include fleets (Fleet, Complete,
        Fleet Pro, the Fleet unlimited license), company licences, and a 7 day free trial for people
        (POST /api/v2/fleet/trial/). Private by default; public only as a paid placement labelled Sponsored.
        Not for navigation.
      security:
        - apiToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FleetPositionBatch"
                - $ref: "#/components/schemas/FleetPosition"
                - type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/FleetPosition" }
      responses:
        "200":
          description: Some or all kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPushResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Every position refused, with the reasons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPushResult" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/fleet/vessels/:
    get:
      operationId: listFleetVessels
      tags: [fleet]
      summary: Your vessels with status, last position and age, speed, course, ETA, warnings near and along the route, approximate under-keel clearance
      description: Without access of your own (the trial over, no plan) only the vessels shared with you are listed.
      security:
        - apiToken: []
        - bearerAuth: []
      parameters:
        - name: detail
          in: query
          description: "1, true or yes: every warning, not the first 5."
          schema: { type: boolean }
      responses:
        "200":
          description: Your vessels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetVesselList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/fleet/vessels/{vessel}/:
    get:
      operationId: getFleetVessel
      tags: [fleet]
      summary: One vessel in full, with her last 24 hours of track and a link to see her in the sky
      security:
        - apiToken: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FleetVesselRef"
      responses:
        "200":
          description: The vessel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetVessel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/fleet/vessels/{vessel}/route/:
    put:
      operationId: setFleetVesselRoute
      tags: [fleet]
      summary: "Set her route for the ETA and the warnings along it ({\"clear\": true} clears it)"
      security:
        - apiToken: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FleetVesselRef"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetRouteRequest" }
      responses:
        "200":
          description: "{ok, route, vessel}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: setFleetVesselRouteByPost
      tags: [fleet]
      summary: The same as PUT, for tools that can only POST
      security:
        - apiToken: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FleetVesselRef"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetRouteRequest" }
      responses:
        "200":
          description: "{ok, route, vessel}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      operationId: clearFleetVesselRoute
      tags: [fleet]
      summary: Clear her route
      security:
        - apiToken: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FleetVesselRef"
      responses:
        "200":
          description: "{ok, route: cleared}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/fleet/webhook/:
    get:
      operationId: getFleetWebhook
      tags: [fleet]
      summary: Your webhook receiver for providers that push, and how to sign (never the secret)
      security:
        - apiToken: []
        - bearerAuth: []
      responses:
        "200":
          description: "{url, secret_hint, signing: {header, value, also, tolerance_s}, last_push_at, last_status, last_refused: {at, why} or null (the last push refused for its signature, kept a day)}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: rotateFleetWebhookSecret
      tags: [fleet]
      summary: "A new signing secret with {\"rotate\": true} (also made when the account has none yet), shown once in this answer"
      security:
        - apiToken: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetWebhookRotate" }
      responses:
        "200":
          description: "{url, secret, secret_note, signing}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/fleet/access/:
    get:
      operationId: getFleetAccess
      tags: [fleet]
      summary: "What this account may do: via plan, licence, trial or staff, vessels, positions a day, the limits"
      security:
        - apiToken: []
        - bearerAuth: []
      responses:
        "200":
          description: "{ok, via, vessels, per_day, trial, why, in_feed, limits}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/fleet/trial/:
    post:
      operationId: startFleetTrial
      tags: [fleet]
      summary: Start the free trial for people (7 days, 3 vessels, once per account, a verified e-mail)
      security:
        - apiToken: []
        - bearerAuth: []
      responses:
        "201":
          description: "{ok, access}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The account has the feed already, or the trial was used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/fleet/hook/{token}/:
    post:
      operationId: receiveFleetWebhook
      tags: [fleet]
      summary: The webhook receiver of one account (its address is on GET /api/v2/fleet/webhook/)
      description: |
        Any JSON the provider sends: our position format, a list, an envelope (data, items, records, vessels...) or a
        GeoJSON FeatureCollection of Points. Sign each push: X-SeaLagom-Signature: t=<unix seconds>,v1=<hex
        HMAC-SHA256 of "<t>.<raw body>" with your secret> (within 5 minutes of our clock), or X-Hub-Signature-256 (or
        X-Signature-256): sha256=<hex HMAC-SHA256 of the raw body>. ?provider= names the source (kept with the
        positions). A signed push is taken once: the same signature again answers 200 with duplicate true and keeps
        nothing (a push refused whole is not remembered, so a retry goes through).
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: X-SeaLagom-Signature, in: header, description: "t=<unix seconds>,v1=<hex HMAC-SHA256>", schema: { type: string } }
        - { name: X-Hub-Signature-256, in: header, description: "sha256=<hex HMAC-SHA256 of the raw body>", schema: { type: string } }
        - { name: X-Signature-256, in: header, description: "The same as X-Hub-Signature-256", schema: { type: string } }
        - { name: provider, in: query, schema: { type: string, maxLength: 40 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenObject" }
      responses:
        "200":
          description: "The same answer as POST /api/v2/fleet/positions/, or {duplicate: true} for a push taken before"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPushResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /mcp/fleet:
    post:
      operationId: callFleetMcp
      tags: [fleet]
      summary: "The fleet feed as an MCP server for agents (JSON-RPC 2.0, streamable HTTP, JSON answers): tools fleet_access, fleet_vessels, fleet_vessel, fleet_push_positions, fleet_set_route, fleet_start_trial"
      description: |
        One JSON-RPC object or a batch (an array of up to 20). initialize, ping and tools/list need no key; tools/call
        needs the key as a Bearer token. Notifications answer 202 with no body. Also at /mcp/fleet/.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
      responses:
        "200":
          description: The JSON-RPC answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "202":
          description: A notification, no body
        "400":
          description: The body is not JSON-RPC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "413":
          description: The body is too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-API-Token
    bearerAuth:
      type: http
      scheme: bearer
      description: The same API key as a Bearer token.
  headers:
    RecordsReturned:
      description: Warnings in this answer.
      schema: { type: integer }
    TokensUsed:
      description: Requests this answer counted (one for every 50 warnings, at least one).
      schema: { type: integer }
  responses:
    BadRequest:
      description: "A parameter or the body could not be used: {detail, errors?}"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A key was sent but it is wrong or inactive, or the call needs a key or a signed-in session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentRequired:
      description: "The free tier or the key's allowance is used up, or a paused licence case lists this key: {detail, free_tier?, pay?, upgrade?}"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "The plan does not include this (include_all or the archive without a plan, the Full API features): {detail, upgrade?}"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "Nothing with that id or name: {detail}"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "A rate limit (archive questions: 30 a minute per address); Retry-After says when to try again"
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    Scope:
      name: scope
      in: query
      description: "navarea, coastal or all (default all). Anything else is a 400."
      schema: { $ref: "#/components/schemas/ScopeFilter" }
    NavareaIds:
      name: navarea_id
      in: query
      description: "One or more NAVAREA region ids. Repeat the parameter or separate with commas; values that are not whole numbers are left out."
      style: form
      explode: true
      schema: { type: array, items: { type: integer } }
    CoastalIds:
      name: coastal_id
      in: query
      description: "One or more coastal region ids. Repeat the parameter or separate with commas."
      style: form
      explode: true
      schema: { type: array, items: { type: integer } }
    Country:
      name: country
      in: query
      description: "Country of the region, partial match, any case."
      schema: { type: string }
    Q:
      name: q
      in: query
      description: "Words in the warning text (original or English), any case."
      schema: { type: string, maxLength: 200 }
    DateFrom:
      name: date_from
      in: query
      description: "Warnings added on or after this UTC day. Only YYYY-MM-DD is read; any other form is ignored."
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      description: "Warnings added on or before this UTC day (to its last second). Only YYYY-MM-DD is read; any other form is ignored."
      schema: { type: string, format: date }
    ArchiveDateFrom:
      name: date_from
      in: query
      description: "Open archive: read like issued_from (YYYY-MM-DD or an ISO date and time, UTC when no zone is given); a value that is not a date is a 400. On a plan with archived data only YYYY-MM-DD is read and any other form is ignored."
      schema: { type: string }
    ArchiveDateTo:
      name: date_to
      in: query
      description: "Open archive: read like issued_to (a day to its end, or an ISO date and time, UTC when no zone is given); a value that is not a date is a 400. On a plan with archived data only YYYY-MM-DD is read and any other form is ignored."
      schema: { type: string }
    Keyword:
      name: keyword
      in: query
      description: "A keyword group (for example Firing exercises) or any word of the text. Repeat for several, any of them matches; at most 10 are read."
      style: form
      explode: true
      schema: { type: array, maxItems: 10, items: { type: string } }
    HasCoordinates:
      name: has_coordinates
      in: query
      description: "true (or 1, yes): only warnings that contain positions."
      schema: { type: boolean }
    IncludeLocals:
      name: include_locals
      in: query
      description: "true (or 1, yes): local warnings (regions of type LOCAL, such as the French AVURNAV) too."
      schema: { type: boolean }
    IncludeArchived:
      name: include_archived
      in: query
      description: "Archived warnings too: a paid API plan with archived data; without one the answer is 403 with the plan"
      schema: { type: boolean }
    OnlyArchived:
      name: only_archived
      in: query
      description: "Archived warnings only: a paid API plan with archived data; without one the answer holds the warnings in force"
      schema: { type: boolean }
    Status:
      name: status
      in: query
      description: "in_force, cancelled or expired; repeat or separate with commas. active, inforce and canceled are read as aliases. Any other value is a 400."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/WarningStatusFilter" } }
    MessageClass:
      name: message_class
      in: query
      description: "The type of warning; repeat or separate with commas. An unknown value is a 400."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/MessageClass" } }
    Station:
      name: station
      in: query
      description: "A NAVTEX station: its coastal region id, or words of its title or sub title (at most 80 characters)."
      schema: { type: string, maxLength: 80 }
    Lat:
      name: lat
      in: query
      description: "With lon: warnings with a position within radius_nm of this point. lat and lon go together (400 otherwise)."
      schema: { type: number, minimum: -90, maximum: 90 }
    Lon:
      name: lon
      in: query
      description: With lat.
      schema: { type: number, minimum: -180, maximum: 180 }
    RadiusNm:
      name: radius_nm
      in: query
      description: "Radius in nautical miles around lat and lon (default 30, from 0.1 to 500; values outside are clamped)."
      schema: { type: number, default: 30, minimum: 0.1, maximum: 500 }
    Bbox:
      name: bbox
      in: query
      description: "west,south,east,north in decimal degrees; west greater than east crosses the date line. A malformed box is a 400."
      schema: { type: string }
    IncludeCoordinates:
      name: include_coordinates
      in: query
      description: "Kept for older clients: positions come on every answer of the API Default and Full API plans whatever this says, and are null on the Basic plans and the free tier. Without such a plan, true adds a note in meta.warnings."
      schema: { type: boolean }
    IncludeEnhancedCoordinates:
      name: include_enhanced_coordinates
      in: query
      description: "true (or 1, yes): coordinates as an EnhancedCoordinates object (text, decimal, DMS, GeoJSON and map pairs) instead of the list. Full API."
      schema: { type: boolean }
    IncludeKeywords:
      name: include_keywords
      in: query
      description: "Kept for older clients: the keyword map comes on every answer of a plan with keywords (Full API) whatever this says. Without one, true adds a note in meta.warnings."
      schema: { type: boolean }
    IncludeGeoFeatures:
      name: include_geo_features
      in: query
      description: "true (exactly, lower case): areas, circles, lines and sectors with decimal points (geo_features). Full API."
      schema: { type: boolean }
    IncludeAiAnalysis:
      name: include_ai_analysis
      in: query
      description: "true (exactly, lower case): the analysis object of each warning (ai_analysis). Full API."
      schema: { type: boolean }
    AiSeverity:
      name: ai_severity
      in: query
      description: "Full API. Repeat or separate with commas; unknown values are left out."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/Severity" } }
    AiCategory:
      name: ai_category
      in: query
      description: "Full API. Analysis category ids; repeat or separate with commas; unknown values are left out."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/AnalysisCategory" } }
    AiStatus:
      name: ai_status
      in: query
      description: "Full API. The live status; repeat or separate with commas. withdrawn reads the archive."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/AnalysisStatus" } }
    AiInForce:
      name: ai_in_force
      in: query
      description: "Full API. true: only warnings in force right now."
      schema: { type: boolean }
    ExpiresWithinHours:
      name: expires_within_hours
      in: query
      description: "Full API. valid_until within the next N hours."
      schema: { type: integer, minimum: 1, maximum: 8784 }
    ExpiresAfter:
      name: expires_after
      in: query
      description: "Full API. valid_until on or after this day (YYYY-MM-DD) or ISO date and time (UTC when no zone is given)."
      schema: { type: string }
    ExpiresBefore:
      name: expires_before
      in: query
      description: "Full API. valid_until on or before this day (to its end) or ISO date and time."
      schema: { type: string }
    ExcludeRoutine:
      name: exclude_routine
      in: query
      description: "Full API. true: leave out routine reports (ice reports, rig lists, in force lists)."
      schema: { type: boolean }
    AiHas:
      name: ai_has
      in: query
      description: "Full API. Only analyses that list these; repeat or separate with commas."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/AnalysisHas" } }
    MinKeepClearNm:
      name: min_keep_clear_nm
      in: query
      description: "Full API. A keep clear distance of at least this many nautical miles."
      schema: { type: number, minimum: 0 }
    Topic:
      name: topic
      in: query
      description: "Full API (403 otherwise): ice or a themed feed slug. Anything else is a 400."
      schema: { $ref: "#/components/schemas/TopicSlug" }
    IceType:
      name: ice_type
      in: query
      description: "With topic=ice (and on /api/v2/ice/): repeat or separate with commas; unknown values are left out."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/IceType" } }
    FeedCategory:
      name: category
      in: query
      description: "With a themed topic or feed: keep only some of the feed's analysis categories. Repeat or separate with commas; values outside the feed are left out."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/AnalysisCategory" } }
    PromptFilter:
      name: prompt_filter
      in: query
      description: "off (or false, 0, none): ignore the key's saved AI prompt filter for this call. Full API."
      schema: { $ref: "#/components/schemas/OffSwitch" }
    Settings:
      name: settings
      in: query
      description: "off (or none, false, 0): ignore the key's saved settings for this call. Works on every /api/v2/ path."
      schema: { $ref: "#/components/schemas/OffSwitch" }
    Preset:
      name: preset
      in: query
      deprecated: true
      description: The older name of settings.
      schema: { $ref: "#/components/schemas/OffSwitch" }
    Page:
      name: page
      in: query
      description: "Page number from 1. Not a number is a 400; page times page_size may not exceed 10000 (400)."
      schema: { type: integer, minimum: 1, default: 1 }
    MessagesPageSize:
      name: page_size
      in: query
      description: "Default 50. At most 200 on a paid plan, 50 without one (and 50 on a page of archived warnings only without an archive plan). Larger values are lowered, not refused."
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    RegionId:
      name: id
      in: query
      description: "One region id (a whole number; anything else is a 400)."
      schema: { type: integer }
    RegionPathId:
      name: id
      in: path
      required: true
      description: The region id.
      schema: { type: integer }
    RegionCountry:
      name: country
      in: query
      description: "Country of the region, partial match."
      schema: { type: string }
    RegionType:
      name: type
      in: query
      description: "Region type, partial match: NAVAREA for NAVAREA regions; COASTAL, LOCAL or NAVTEX_FEED for coastal regions."
      schema: { type: string }
    RegionTimeFrom:
      name: time_from
      in: query
      description: "Regions updated (time_upd) at or after this ISO date and time. A time without a zone is read as UTC: give the offset (+02:00) or a UTC time. A value that is not a date and time is a 400."
      schema: { type: string, format: date-time }
    RegionTimeTo:
      name: time_to
      in: query
      description: "Regions updated (time_upd) at or before this ISO date and time. A time without a zone is read as UTC: give the offset (+02:00) or a UTC time. A value that is not a date and time is a 400."
      schema: { type: string, format: date-time }
    RegionTitleSearch:
      name: title_search
      in: query
      description: NAVAREA regions whose title contains these words.
      schema: { type: string }
    RegionTitle:
      name: title
      in: query
      description: Coastal regions whose title contains these words.
      schema: { type: string }
    RegionSubTitle:
      name: sub_title
      in: query
      description: Coastal regions whose sub title contains these words.
      schema: { type: string }
    RegionContentSearch:
      name: content_search
      in: query
      description: Regions whose full text (content_full) contains these words.
      schema: { type: string }
    IncludeMessages:
      name: include_messages
      in: query
      description: "true (exactly, lower case): the warnings in force inside each region (active_messages)."
      schema: { type: boolean }
    RegionIncludeArchived:
      name: include_archived
      in: query
      description: "true (exactly, lower case): the archived warnings inside each region too (archived_messages). Needs a plan with archived data; 403 otherwise."
      schema: { type: boolean }
    IncludeAll:
      name: include_all
      in: query
      description: "true (exactly, lower case): every warning of each region, not one batch. Full API, or a plan with bulk requests (capped by the requests left on a plan with a request count); 403 on other plans and without a plan."
      schema: { type: boolean }
    RegionIncludeEnhancedCoordinates:
      name: include_enhanced_coordinates
      in: query
      description: "true (exactly, lower case): coordinates as an EnhancedCoordinates object. Full API."
      schema: { type: boolean }
    RegionIncludeKeywords:
      name: include_keywords
      in: query
      description: "Accepted and has no effect here: the keyword map comes whenever the plan has keywords (Full API) and is null otherwise."
      schema: { type: boolean }
    RegionIncludeCoordinates:
      name: include_coordinates
      in: query
      description: "Accepted and has no effect here: the positions come on the API Default and Full API plans and are null on the Basic plans and the free tier."
      schema: { type: boolean }
    CoastalIncludeLocals:
      name: include_locals
      in: query
      description: "Accepted and has no effect here: LOCAL and NAVTEX_FEED regions are always listed. Use type=COASTAL to leave them out."
      schema: { type: boolean }
    RegionPageNumber:
      name: page
      in: query
      description: "Page number from 1 (not a number, or a page past the last, answers 404)."
      schema: { type: integer, minimum: 1, default: 1 }
    RegionPageSize:
      name: page_size
      in: query
      description: "Regions a page (default 50, at most 1000). The free tier: at most 50 warnings in all on the page."
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    ArchivePage:
      name: page
      in: query
      description: "Open archive: page number from 1 (not a number is a 400; page times page_size may not exceed 10000, use the cursor past it)."
      schema: { type: integer, minimum: 1, default: 1 }
    Cursor:
      name: cursor
      in: query
      description: "Open archive: meta.next_cursor of the previous page."
      schema: { type: string }
    ArchivePageSize:
      name: page_size
      in: query
      description: "Open archive: at most 50 (and at most the free tier's records a call)."
      schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
    ArchiveStatus:
      name: status
      in: query
      description: "Open archive: cancelled or expired (in_force alone gives an empty list and a note in meta.warnings). Any other value is a 400."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/WarningStatusFilter" } }
    ArchiveCategory:
      name: category
      in: query
      description: "Open archive: the same as message_class."
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/MessageClass" } }
    IssuedFrom:
      name: issued_from
      in: query
      description: "Open archive: warnings added on or after this day (YYYY-MM-DD) or ISO date and time; date_from is read the same way here. A value that is not a date is a 400."
      schema: { type: string }
    IssuedTo:
      name: issued_to
      in: query
      description: "Open archive: warnings added on or before this day (to its end) or ISO date and time."
      schema: { type: string }
    PublicId:
      name: public_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FleetVesselRef:
      name: vessel
      in: path
      required: true
      description: "Our id, MMSI, IMO, your own id or her name"
      schema: { type: string }
  schemas:
    WarningPage:
      type: object
      description: A page of warnings (/api/v2/messages/, /api/v2/ice/, /api/v2/feeds/{slug}/).
      required: [count, page, page_size, next, previous, results]
      properties:
        count: { type: integer, description: "Warnings matching the request, all pages" }
        page: { type: integer }
        page_size: { type: integer }
        next: { type: [string, "null"], description: "The next page as an absolute address, or null on the last page" }
        previous: { type: [string, "null"], description: "The previous page as an absolute address, or null on the first page" }
        results:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        meta:
          oneOf:
            - $ref: "#/components/schemas/WarningPageMeta"
            - type: "null"
    WarningPageMeta:
      type: object
      description: Present only when there is something to say.
      properties:
        warnings: { type: array, items: { type: string }, description: "Features left out for the plan, ignored filters" }
        upgrade:
          oneOf:
            - $ref: "#/components/schemas/Upgrade"
            - type: "null"
        prompt_filter:
          oneOf:
            - $ref: "#/components/schemas/PromptFilterMeta"
            - type: "null"
        topic:
          oneOf:
            - $ref: "#/components/schemas/TopicMeta"
            - type: "null"
        archive:
          oneOf:
            - $ref: "#/components/schemas/ArchiveMeta"
            - type: "null"
        free_tier:
          oneOf:
            - $ref: "#/components/schemas/FreeTierMeta"
            - type: "null"
        stale_sources:
          type: array
          description: /api/v2/messages/ only. The regions of this page whose source is not answering.
          items: { $ref: "#/components/schemas/StaleSource" }
      additionalProperties: true
    PromptFilterMeta:
      type: object
      description: The key's saved AI prompt filter, as applied.
      properties:
        prompt: { type: string }
        status: { type: string }
        matched: { type: integer }
      additionalProperties: true
    TopicMeta:
      type: object
      properties:
        topic: { type: string }
        matched: { type: integer }
        title: { type: string, description: Themed feeds only }
        categories: { type: array, items: { type: string }, description: Themed feeds only }
        ice_types: { type: array, items: { type: string }, description: The ice feed only }
      additionalProperties: true
    ArchiveMeta:
      type: object
      description: "Archived warnings read 50 a request (no archive plan) together with the warnings in force."
      properties:
        open: { type: boolean }
        page_max: { type: integer }
        archived_page_size: { type: integer }
        archived_total: { type: integer }
        note: { type: string }
      additionalProperties: true
    Warning:
      type: object
      description: "One warning as a row of /api/v2/messages/, /api/v2/ice/ and /api/v2/feeds/{slug}/. The stable key is (scope, region_id, number); id is unique only within (scope, is_archived)."
      required: [scope, region_id, id, number, is_archived]
      properties:
        scope: { $ref: "#/components/schemas/WarningScope" }
        region_id: { type: integer }
        region_title: { type: string, description: "The region's title (a coastal region: title and sub title)" }
        country: { type: string, description: "The region's country; can be empty or None" }
        is_archived: { type: boolean }
        archived_on: { type: [string, "null"], format: date-time, description: "When it left force; null for a warning in force" }
        id: { type: integer }
        title: { type: string }
        number: { type: string }
        content: { type: string }
        added_on: { type: [string, "null"], format: date-time, description: "When SeaLagom received it (UTC); can be null for a warning in force" }
        cancel_date: { type: [string, "null"], format: date-time, description: "The end the warning gives itself; warnings in force only (absent on archived rows)" }
        coordinates: { type: [array, object, "null"], items: { type: string }, additionalProperties: true, description: "null on the Basic plans and the free tier (positions come on the API Default and Full API plans), or when none were read; otherwise the positions as printed in the warning (an array of strings), or with include_enhanced_coordinates an object of the EnhancedCoordinates shape. The ice and themed feeds give the object by default." }
        keywords: { type: [object, "null"], additionalProperties: true, description: "Keyword groups and the phrases matched in the text (group name to a list of phrases); null without a plan that has keywords." }
        geo_features:
          description: "null unless include_geo_features=true on the Full API plan, or when the warning has no shapes"
          oneOf:
            - $ref: "#/components/schemas/GeoFeatures"
            - type: "null"
        ai_analysis:
          description: "null unless include_ai_analysis=true on the Full API plan, or when there is no analysis yet"
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        content_en: { type: string, description: "English text (the original when it is English)" }
        source_language: { type: string, description: "Language code of the original (en by default)" }
        ice:
          description: "The ice feed and topic=ice only"
          oneOf:
            - $ref: "#/components/schemas/IceMatch"
            - type: "null"
        feed:
          description: "Themed feeds only"
          oneOf:
            - $ref: "#/components/schemas/FeedMatch"
            - type: "null"
    IceMatch:
      type: object
      properties:
        type: { type: [string, "null"], description: "iceberg, sea_ice, ice_edge, icing, ice_report, icebreaker, ice_navigation or other_ice" }
        reason: { type: [string, "null"] }
      additionalProperties: true
    FeedMatch:
      type: object
      properties:
        category: { type: [string, "null"], description: The analysis category that put the warning in the feed }
      additionalProperties: true
    RegionWarning:
      type: object
      description: "A warning inside a region (active_messages, archived_messages) and in the per region messages calls. It has no scope, region, country, language or archive flag fields: the region holding it gives them."
      required: [id, number]
      properties:
        id: { type: integer }
        title: { type: string }
        number: { type: string }
        content: { type: string }
        added_on: { type: [string, "null"], format: date-time }
        cancel_date: { type: [string, "null"], format: date-time, description: Warnings in force only }
        archived_on: { type: [string, "null"], format: date-time, description: Archived warnings only }
        coordinates: { type: [array, object, "null"], items: { type: string }, additionalProperties: true, description: "null on the Basic plans and the free tier (positions come on the API Default and Full API plans), or when none were read; otherwise the positions as printed in the warning (an array of strings), or with include_enhanced_coordinates an object of the EnhancedCoordinates shape. The ice and themed feeds give the object by default." }
        keywords: { type: [object, "null"], additionalProperties: true, description: "Keyword groups and the phrases matched in the text (group name to a list of phrases); null without a plan that has keywords." }
        geo_features:
          oneOf:
            - $ref: "#/components/schemas/GeoFeatures"
            - type: "null"
        ai_analysis:
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
    EnhancedCoordinates:
      type: object
      description: The shape of coordinates with include_enhanced_coordinates. Every list is empty when the warning has no positions.
      properties:
        text_coordinates: { type: array, items: { type: string }, description: The positions as printed }
        decimal_coordinates:
          type: array
          description: "[lat, lon] pairs"
          items: { type: array, items: { type: number } }
        google_coordinates: { type: array, items: { type: string }, description: "\"lat lon\" text" }
        geojson_coordinates:
          type: array
          description: "[lon, lat] pairs"
          items: { type: array, items: { type: number } }
        dms_coordinates:
          type: array
          description: "[lat, lon] pairs in degrees, minutes and seconds"
          items: { type: array, items: { type: string } }
    GeoFeatures:
      type: object
      description: The shapes read from the warning, as stored (older warnings may lack some keys).
      properties:
        version: { type: [integer, "null"] }
        features: { type: array, items: { $ref: "#/components/schemas/GeoFeature" } }
        keyword_geometry: { type: array, items: { type: object, additionalProperties: true } }
        section_markers: { type: array, items: { type: object, additionalProperties: true } }
        message_profile: { type: [string, "null"] }
        zone_labels: { type: array, items: { type: string } }
        multi_zone: { type: [boolean, "null"] }
        corridor_nm: { type: [number, "null"] }
        corridors_nm: { type: array, items: { type: number } }
        safety_zone:
          description: "The safety zone the text gives around a rig or a point (for example 500 METER SAFETY ZONE), or null"
          oneOf:
            - $ref: "#/components/schemas/SafetyZone"
            - type: "null"
        clearance_nm: { type: [number, "null"] }
      additionalProperties: true
    SafetyZone:
      type: object
      properties:
        safety_zone_meters: { type: [number, "null"], description: The radius in metres as given }
        safety_zone_nm: { type: [number, "null"], description: The same radius in nautical miles }
      additionalProperties: true
    GeoFeature:
      type: object
      properties:
        id: { type: [string, "null"] }
        kind: { type: [string, "null"], description: "area, circle, line, lane, point, sector or displacement" }
        label: { type: [string, "null"] }
        keyword_refs: { type: array, items: { type: string } }
        source: { type: [string, "null"] }
        coordinates_raw: { type: array, items: { type: string } }
        points: { type: array, items: { $ref: "#/components/schemas/GeoPoint" } }
        radius_nm: { type: [number, "null"], description: Circles only }
        closed: { type: [boolean, "null"] }
        metadata: { type: [object, "null"], additionalProperties: true }
        safety_zone_meters: { type: [number, "null"], description: "Points of a warning with a safety zone: its radius in metres" }
        safety_zone_nm: { type: [number, "null"], description: "Points of a warning with a safety zone: its radius in nautical miles" }
      additionalProperties: true
    GeoPoint:
      type: object
      properties:
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        text: { type: [string, "null"] }
      additionalProperties: true
    AnalysisCompact:
      type: object
      description: The short analysis of a warning (route checks and warnings near a position).
      properties:
        headline: { type: string }
        category: { type: string, description: "One of the AnalysisCategory ids" }
        category_label: { type: string }
        subject: { type: string }
        subject_label: { type: string }
        feeds: { type: array, items: { $ref: "#/components/schemas/FeedRef" } }
        severity: { type: string, description: "critical, high, moderate, low or info (can be empty)" }
        status: { type: string, description: "The live status: active, scheduled, expired, withdrawn, cancellation_notice or informational" }
        status_label: { type: string }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        is_routine: { type: boolean }
        series_key: { type: string }
        series_label: { type: string }
        newsworthy: { type: boolean }
      additionalProperties: true
    Analysis:
      type: object
      description: "The machine-made analysis of one warning (Full API). The warning is the authority. status, severity and category are open strings: new values can appear."
      properties:
        headline: { type: string }
        category: { type: string, description: "One of the AnalysisCategory ids" }
        category_label: { type: string }
        subject: { type: string }
        subject_label: { type: string }
        feeds: { type: array, items: { $ref: "#/components/schemas/FeedRef" }, description: "The feeds the warning is in (ice included)" }
        severity: { type: string, description: "critical, high, moderate, low or info (can be empty)" }
        status: { type: string, description: "The live status: active, scheduled, expired, withdrawn, cancellation_notice or informational" }
        status_label: { type: string }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time, description: "The end of validity (the warning's own cancel date when the analysis has none)" }
        is_routine: { type: boolean }
        series_key: { type: string }
        series_label: { type: string }
        newsworthy: { type: boolean }
        summary: { type: string }
        status_at_analysis: { type: string, description: "active, scheduled, expired, cancellation_notice or informational when analysed (can be empty)" }
        validity_text: { type: string }
        time_windows: { type: array, items: { $ref: "#/components/schemas/AnalysisTimeWindow" } }
        location: { type: string }
        hazards: { type: array, items: { type: string } }
        mariner_action: { type: string }
        background: { type: string, description: "General knowledge, newsworthy warnings only (not from the warning)" }
        cancels: { type: array, items: { type: string } }
        references: { type: array, items: { type: string } }
        keep_clear_nm: { type: [number, "null"] }
        keep_clear_text: { type: string }
        contacts: { type: array, items: { $ref: "#/components/schemas/AnalysisContact" } }
        vessels: { type: array, items: { $ref: "#/components/schemas/AnalysisVessel" } }
        ports: { type: array, items: { $ref: "#/components/schemas/AnalysisNamed" } }
        platforms: { type: array, items: { $ref: "#/components/schemas/AnalysisNamed" } }
        stations: { type: array, items: { $ref: "#/components/schemas/AnalysisNamed" } }
        depth_m: { type: [number, "null"] }
        observed_at: { type: [string, "null"], format: date-time }
        aids: { type: array, items: { $ref: "#/components/schemas/AnalysisAid" } }
        charts: { type: array, items: { type: string } }
        positions_read: { type: array, items: { type: string } }
        coord_check: { $ref: "#/components/schemas/CoordCheck" }
        translations:
          type: object
          description: "Language code (zh, es, ru, pt, el, uk, tr, fr, tl) to the translated texts"
          additionalProperties: { $ref: "#/components/schemas/AnalysisTranslation" }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        analyzed_at: { type: [string, "null"], format: date-time }
        model: { type: string }
        matches: { type: [object, "null"], additionalProperties: true, description: "The region calls only: what the site knows about the named vessels, ports, platforms, stations and aids" }
      additionalProperties: true
    AnalysisTimeWindow:
      type: object
      properties:
        start: { type: [string, "null"], format: date-time }
        end: { type: [string, "null"], format: date-time }
        note: { type: string }
      additionalProperties: true
    AnalysisContact:
      type: object
      properties:
        type: { type: string, description: "vhf, phone, email, station, website or other" }
        value: { type: string }
        note: { type: string }
      additionalProperties: true
    AnalysisVessel:
      type: object
      properties:
        name: { type: string }
        call_sign: { type: string }
        mmsi: { type: string }
        imo: { type: string }
        role: { type: string }
      additionalProperties: true
    AnalysisNamed:
      type: object
      description: "A port ({name, country}), a platform or a station ({name, kind})"
      properties:
        name: { type: string }
        country: { type: string }
        kind: { type: string }
      additionalProperties: true
    AnalysisAid:
      type: object
      properties:
        name: { type: string }
        identifier: { type: string }
        characteristic: { type: string }
        condition: { type: string }
        position: { type: string }
      additionalProperties: true
    AnalysisTranslation:
      type: object
      properties:
        headline: { type: string }
        summary: { type: string }
        mariner_action: { type: string }
        background: { type: string }
      additionalProperties: true
    CoordCheck:
      type: object
      description: "The analysis' positions against the parser's; an empty object when the check did not run"
      properties:
        status: { type: string, description: "ok, mismatch, parser_found_none, no_positions or skipped" }
        reason: { type: string }
        ai_count: { type: integer }
        parser_count: { type: integer }
        ai_only: { type: array, items: { type: string } }
        parser_only: { type: array, items: { type: string } }
        ai_unparsed: { type: array, items: { type: string } }
        needs_review: { type: boolean }
      additionalProperties: true
    FeedRef:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
    Region:
      type: object
      description: "A NAVAREA or a coastal region. sub_title is on coastal regions only."
      required: [id]
      properties:
        id: { type: integer }
        title: { type: string }
        content_full: { type: string, description: "The whole bulletin text of the region as last read (can be long, or empty)" }
        time_upd: { type: string, format: date-time, description: When the region was last updated }
        country: { type: string, description: "Can be empty or None; International on the NAVTEX feed regions" }
        sub_title: { type: string, description: Coastal regions only }
        type: { type: string, description: "NAVAREA for a NAVAREA; COASTAL, LOCAL or NAVTEX_FEED for a coastal region (an open string: new types can appear)" }
        active_messages:
          type: array
          description: "Empty unless include_messages=true"
          items: { $ref: "#/components/schemas/RegionWarning" }
        archived_messages:
          type: array
          description: "Empty unless include_archived=true on a plan with archived data"
          items: { $ref: "#/components/schemas/RegionWarning" }
    RegionPage:
      type: object
      description: A page of regions (/api/v2/navarea/ and /api/v2/coastal/).
      required: [count, next, previous, results]
      properties:
        count: { type: integer }
        next: { type: [string, "null"] }
        previous: { type: [string, "null"] }
        results: { type: array, items: { $ref: "#/components/schemas/Region" } }
        navarea_sequence: { type: [integer, "null"], description: "/api/v2/navarea/ only: the server's update sequence" }
        meta:
          oneOf:
            - $ref: "#/components/schemas/TierMeta"
            - type: "null"
    TierMeta:
      type: object
      description: "The meta of an answer that carries only the free tier (meta.free_tier)."
      properties:
        free_tier:
          oneOf:
            - $ref: "#/components/schemas/FreeTierMeta"
            - type: "null"
      additionalProperties: true
    RegionMessages:
      type: object
      description: The per region messages call.
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/RegionWarning" } }
        meta: { $ref: "#/components/schemas/RegionMessagesMeta" }
    RegionArchivedMessages:
      type: object
      description: The per region archived_messages call.
      required: [archived_messages]
      properties:
        archived_messages: { type: array, items: { $ref: "#/components/schemas/RegionWarning" } }
        meta: { $ref: "#/components/schemas/RegionMessagesMeta" }
    RegionMessagesMeta:
      type: object
      properties:
        records_returned: { type: integer }
        tokens_used: { type: integer }
        warnings: { type: array, items: { type: string }, description: "Unknown parameter names and other notes" }
        remaining_tokens: { type: integer, description: "Plans with a request count" }
        free_tier:
          oneOf:
            - $ref: "#/components/schemas/FreeTierMeta"
            - type: "null"
        free_tokens_remaining: { type: integer }
        source_status:
          description: "messages only: the region's source is not answering"
          oneOf:
            - $ref: "#/components/schemas/SourceStatus"
            - type: "null"
        archive: { type: string, description: "Open archive: open" }
        page_max: { type: integer, description: "Open archive" }
        page: { type: [integer, "null"], description: "Open archive (null after a cursor)" }
        page_size: { type: integer, description: "Open archive" }
        total: { type: integer, description: "Open archive" }
        total_capped: { type: boolean, description: "Open archive: total is a lower bound" }
        total_pages: { type: integer, description: "Open archive" }
        has_more: { type: boolean, description: "Open archive" }
        next_page: { type: [integer, "null"], description: "Open archive" }
        next_cursor: { type: [string, "null"], description: "Open archive" }
        filters: { type: object, additionalProperties: true, description: "Open archive: the filters as read" }
        position_capped: { type: boolean, description: "Open archive: the position scan stopped early" }
      additionalProperties: true
    SourceStatus:
      type: object
      properties:
        state: { type: string, description: not_answering }
        since: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"] }
        notice: { type: [string, "null"] }
      additionalProperties: true
    StaleSource:
      type: object
      properties:
        scope: { type: string }
        region_id: { type: integer }
        region_title: { type: string }
        state: { type: string, description: not_answering }
        since: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"] }
        notice: { type: [string, "null"] }
      additionalProperties: true
    FreeTierMeta:
      type: object
      description: The free tier of this caller (calls left, records a call, the end).
      properties:
        keyed_on: { type: string, description: "address or account" }
        calls_left_today: { type: [integer, "null"] }
        calls_left_total: { type: [integer, "null"] }
        calls_per_day: { type: integer }
        records_per_call: { type: integer }
        ends_at: { type: [string, "null"], format: date-time }
        plans: { type: string }
        trimmed: { type: boolean, description: Rows were cut to the records a call }
        found: { type: integer, description: "Route checks only: the warnings found before the cut" }
      additionalProperties: true
    Upgrade:
      type: object
      description: The plan that unlocks what was left out, at this request's price.
      properties:
        plan: { type: string }
        monthly_usd: { type: string }
        yearly_usd: { type: string }
        unlocks: { type: array, items: { type: string } }
        card: { type: string }
        crypto: { type: object, additionalProperties: true }
        plans: { type: string }
      additionalProperties: true
    Error:
      type: object
      description: "An error answer. detail says what happened; the other fields appear where they apply."
      properties:
        detail: { type: string }
        errors: { type: array, items: { type: string } }
        upgrade:
          oneOf:
            - $ref: "#/components/schemas/Upgrade"
            - type: "null"
        pay: { type: [object, "null"], additionalProperties: true }
        free_tier: { type: [object, "null"], additionalProperties: true }
      additionalProperties: true
    WarningFeatureCollection:
      type: object
      description: "The ice and themed feeds as GeoJSON (/api/v2/ice/geojson/, /api/v2/feeds/{slug}/geojson/, or output=geojson on the feed addresses): one feature per shape of each warning (a warning without positions has geometry null)."
      properties:
        type: { type: string, description: FeatureCollection }
        bbox: { type: array, items: { type: number }, description: "[west, south, east, north]" }
        features: { type: array, items: { $ref: "#/components/schemas/WarningFeature" } }
        count: { type: [integer, "null"] }
        page: { type: [integer, "null"] }
        next: { type: [string, "null"] }
        meta: { type: [object, "null"], additionalProperties: true }
    WarningFeature:
      type: object
      properties:
        type: { type: string, description: Feature }
        geometry: { type: [object, "null"], additionalProperties: true, description: "A GeoJSON geometry" }
        properties: { $ref: "#/components/schemas/WarningFeatureProperties" }
    WarningFeatureProperties:
      type: object
      properties:
        scope: { type: [string, "null"] }
        region_id: { type: [integer, "null"] }
        region_title: { type: [string, "null"] }
        number: { type: [string, "null"] }
        is_archived: { type: [boolean, "null"] }
        added_on: { type: [string, "null"], format: date-time }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        headline: { type: [string, "null"] }
        content: { type: [string, "null"] }
        url: { type: string }
        ice_type: { type: [string, "null"] }
        ice_reason: { type: [string, "null"] }
        feed_category: { type: [string, "null"] }
        shape: { type: [string, "null"], description: "The shape's kind, or positions" }
        label: { type: [string, "null"] }
        radius_nm: { type: [number, "null"] }
      additionalProperties: true
    FeedCatalogue:
      type: object
      properties:
        feeds: { type: array, items: { $ref: "#/components/schemas/FeedInfo" } }
    FeedInfo:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        categories: { type: array, items: { type: string } }
        endpoint: { type: string }
        in_force: { type: [integer, "null"], description: "Warnings in force now (null for the ice feed)" }
      additionalProperties: true
    RouteWaypoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, description: "Degrees east; past 180 is brought back in range" }
    RouteRequest:
      type: object
      required: [waypoints]
      properties:
        waypoints:
          type: array
          minItems: 2
          maxItems: 20000
