        "402": { $ref: "#/components/responses/PaymentRequired" }
  /api/v2/ports/:
    get:
      operationId: listPorts
      tags: [lookups]
      summary: Ports by name, UN/LOCODE or country, the nearest to a position, or the ports of a 2 degree cell
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Words of the name, a UN/LOCODE or a country" }
        - name: lat
          in: query
          description: "With lon: the nearest ports within radius_nm (page is then ignored and page_size is the number of ports)."
          schema: { type: number, minimum: -90, maximum: 90 }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - name: radius_nm
          in: query
          description: "With lat and lon: default 60, from 1 to 300."
          schema: { type: number, default: 60, minimum: 1, maximum: 300 }
        - name: cell
          in: query
          description: "LAT,LON of the south west corner of a 2 degree square on even whole degrees: the ports in it ({cell, ports})."
          schema: { type: string }
        - name: known
          in: query
          description: "With lat and lon, 1 or true: real harbours only."
          schema: { type: boolean }
        - { name: sort, in: query, description: "rank: the most important ports first", schema: { $ref: "#/components/schemas/PortSort" } }
        - name: top
          in: query
          description: "1 or true: the main ports only."
          schema: { type: boolean }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: page_size
          in: query
          description: "Default 40, from 10 to 100 (values outside are clamped)."
          schema: { type: integer, minimum: 10, maximum: 100, default: 40 }
      responses:
        "200":
          description: A page of ports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /api/v2/ports/{slug}/:
    get:
      operationId: getPort
