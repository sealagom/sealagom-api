              schema: { $ref: "#/components/schemas/Station" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/vessels/:
    get:
      operationId: searchVessels
      tags: [lookups]
      summary: "A vessel by name, call sign or MMSI: the warnings naming it, its rows, stations with that MMSI, live AIS when on"
      parameters:
