            text/plain:
              schema: { type: string }
  /api/public/sky/weather/:
    get:
      operationId: getPublicWeather
      tags: [public]
      summary: Weather, sea and time zone now at one position (the sky explorer's Weather here and Clock tools)
      description: |
        The position is rounded to 0.1 degree; each cell is kept 15 minutes (Cache-Control public, max-age=900).
        Air from Open-Meteo current conditions (OpenWeather when Open-Meteo fails), sea from the Open-Meteo marine
        model (null on land). Time zone from the nearest port within 60 nm that has one (kind "port", IANA name and
        the offset in force now), otherwise nautical zone time, one hour per 15 degrees of longitude (kind "nautical").
        Wind in knots and degrees true it comes from; stars "good" (cloud under 30 % and visibility 10 km or more),
        "poor" (cloud over 70 % or rain), else "fair". When the weather source fails the answer is still 200 with
        air null and a message, kept 2 minutes. Browser use from sealagom.com pages; at most 10 requests in 10 s.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: |
            {lat, lon, time (ISO UTC), tz: {name, offset_min, kind, label, port?: {name, distance_nm}},
            air: {temp_c, feels_c, wind_kn, wind_dir, gust_kn, beaufort, pressure_hpa, humidity, cloud_pct,
            visibility_km, precip_mm, weather} or null, sea: {wave_m, wave_dir, swell_m, swell_dir, swell_period_s,
            sea_temp_c} or null, stars, sources, message?}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/public/sky/surface/:
    get:
      operationId: getSurface
      tags: [public]
      summary: Sea, coast or land at one position, with the distance to the nearest coastline
      description: |
        Natural Earth 1:10m land and minor islands with lakes of 100 km2 and more as water (public domain), good to
        a few hundred metres at the shore; rivers and canals read as land.
        "land" inside the land more than 0.5 nm from the shore, "coast" at sea within 12 nm of land or on land within
        0.5 nm of the shore, "sea" further out. coast_nm is great-circle nautical miles (0.1 nm under 100 nm).
        Cache-Control public, max-age=86400.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: "{kind: sea|coast|land, coast_nm, land: true|false}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/next-auth/sky/scene/:
    get:
      operationId: getSkyScene
      tags: [public]
      summary: Ships, warnings, rigs, ports and coast stations around a position, for the sky explorer's scene
      description: |
        Signed-in session on sealagom.com or signed out; everything in it is what the map shows the same person.
        Ships are the live AIS ships within r: every ship for Contributor plans, otherwise the same half the
        public map shows (length_m null). Warnings are every NAVAREA and coastal warning in force within 200 nm,
        whatever r is (a day's run at 8 knots), nearest first, at most 300, free for everyone: the nearest point and
        its distance, within 20 nm the outline as it lies on the water (parts), and launch when a rocket launch's
        hazard area is linked to it (see /api/public/space/launches/). Rigs are the active MODU catalogue; ports within r + 10 nm; stations the DSC coast stations (NGA
        Pub 117) whose band range covers the position, vhf [70] when the position is within its VHF range. lights is always
        empty (the site has no list of lights). The position is snapped to a 0.05 degree cell (lat and lon in the
        answer are the cell's, distances are from it); each cell, radius and plan tier is kept 60 s.
        Cache-Control private, max-age=30.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: r, in: query, schema: { type: number, default: 15, minimum: 1, maximum: 40 }, description: "Radius in nm, rounded and clamped to 1 to 40" }
      responses:
        "200":
          description: |
            {lat, lon, r_nm, tier: free|contributor, surface: {kind, coast_nm, land},
            ships: [{mmsi, name, type: cargo|tanker|passenger|fishing|tug|sailing|pleasure|hsc|other, lat, lon, cog,
            sog_kn, heading, length_m, nav_status, age_s}],
            warnings: [{id: "navarea:123", scope, region, number, title, headline, lat, lon (the nearest point),
            distance_nm, url, parts?: [{t: point|line|area, pts: [[lat, lon], ...]}] (within 20 nm),
            launch?: {id, mission, rocket, provider, net, window_start, window_end, window, line}}],
            rigs: [{id, name, lat, lon, kind: platform|fpso|rig|other, distance_nm, url}], lights: [],
            ports: [{slug, name, lat, lon, size, rank, distance_nm}],
            stations: [{name, lat, lon, vhf, mmsi, hours, bands, range_nm, distance_nm, position_approximate}],
            generated (ISO UTC)}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/next-auth/sky/route/import/:
    post:
      operationId: importSkyRoute
      tags: [public]
      summary: A route file read for the sky view's sea (the website's own call)
      description: |
        Signed-in session on sealagom.com or signed out, with the site's CSRF token. The map's parsers and limits (2 MB,
        500 waypoints); the file is read and forgotten, nothing is stored. Each file read counts one "route" of the sky's
        allowance (the founder page's): 30 a day Full Contributor, 150 Fleet, 500 Complete, 1,000 Fleet Pro, none for staff
        and licenses; 5 in the 15 minutes of full access everyone else has (429 above it, with the next plan or, at the
        top, contact us). A file that cannot be read is not counted. Programs use POST /api/v2/sky/route/ with a key
        instead. Not for navigation.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: "{name, waypoints, leg_types, distance_nm, legs: [{course, distance_nm, type, speed_kn?, hours?, xtd_port_nm?, xtd_stbd_nm?}], speed_kn, etd, sky: {at: {lat, lon}, look}, note}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: "The allowance is used: {detail, limit: {status_text, label, url}}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/next-auth/sky/link/open/:
    get:
      operationId: checkSkyLinkOpen
      tags: [public]
      summary: May the sky view stand where a sky link says (the website's own call)
      description: |
        The founder page asks this before it follows a link's at= (or route=). A link the server made (LagoPal, the API:
        its sig= matches) opens for anyone at no cost. A link typed or changed by hand counts one typed position of the
        sky's allowance (the same place again counts once). Not for navigation.
      security: []
      parameters:
        - { name: at, in: query, description: "lat,lon where the view stands", schema: { type: string } }
        - { name: look, in: query, description: "The view's bearing, as in the link", schema: { type: string } }
        - { name: focus, in: query, description: "What the view looks at, as in the link", schema: { type: string } }
        - { name: aboard, in: query, description: "1 when the view is from a ship's bridge", schema: { type: string } }
        - { name: route, in: query, description: "A route as an encoded polyline", schema: { type: string } }
        - { name: legs, in: query, description: "One letter a leg: R rhumb line, G great circle", schema: { type: string } }
        - { name: sig, in: query, description: "The signature of a link the server made", schema: { type: string } }
      responses:
        "200":
          description: "{ok: true, signed}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "403":
          description: "Not on this plan: {ok: false, detail, next, href}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "The allowance is used: {ok: false, detail, next, href | contact}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/next-auth/sky/moment/:
    get:
      operationId: getSkyMoment
      tags: [public]
      summary: "Beta, closed: what the site knows about one place at one moment (weather, warnings in force, ships)"
      x-beta: true
      description: |
        Beta. Not open yet: it answers staff of sealagom.com only (404 for everyone else) and will become part of a
        paid API plan. The weather then is the Open-Meteo model hour nearest t (the forecast model for the last 60
        days and the next 7, the ERA5 archive back to 1940; the archive has no visibility; the sea from the marine
        model, null on land or before its records). Warnings in force at t within r: archived warnings added on or
        before t and archived after it, and live warnings added on or before t (the site's own dates, nearest
        first, at most 40). Ships from the site's AIS history (a snapshot every 15 minutes, the one at or before t),
        with the map's plan rule (every ship for Contributor plans, otherwise the public half); empty with
        ships_reason when there is no snapshot. parts says the source of each part and how far its own time is from
        t. The position is snapped to a 0.05 degree cell. Cache-Control private, no-store.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: t, in: query, required: true, schema: { type: string, format: date-time }, description: "ISO 8601, from 1940-01-01 to 7 days ahead, e.g. 2026-10-20T22:00:00Z. A time without a zone is read as UTC." }
        - { name: r, in: query, schema: { type: number, default: 15, minimum: 1, maximum: 40 }, description: "Radius in nm, rounded and clamped to 1 to 40" }
      responses:
        "200":
          description: |
            {lat, lon, t, r_nm,
            weather: {hour, model: forecast|archive, air: {temp_c, wind_kn, wind_dir, gust_kn, beaufort, cloud_pct,
            visibility_km, pressure_hpa, humidity, precip_mm, weather} or null, sea: {wave_m, wave_dir, wave_period_s,
            swell_m, swell_dir, swell_period_s, sea_temp_c} or null} or null,
            warnings: [{id, scope, series, number, title, headline, lat, lon, distance_nm, from, until, archived, url}],
            sea_warnings: [the same warnings in force at t out to 200 nm, in the form of the scene's warnings],
            ships: [{mmsi, name, type, lat, lon, cog, sog_kn, heading, length_m, nav_status, age_s}], ships_reason?,
            parts: {weather|warnings|ships: {source, gap}}, sources}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/public/sky/space/:
    get:
      operationId: getSpaceObjects
      tags: [public]
      summary: Objects in orbit for the sky's space layers, now and a minute later (SGP4)
      description: |
        Groups: bright (CelesTrak visual, the brightest objects), stations (the stations' modules and visiting craft,
        free flyers only), recent (launched in the last 30 days), rocket (rocket bodies: those of the groups above,
        and every rocket body in orbit from Space-Track when the site's account is set), debris (the Fengyun 1C,
        Cosmos 2251 and Iridium 33 debris clouds). Starlink, the ISS, Hubble and Tiangong are never in them (their
        own endpoints). Element sets fetched at most every 6 hours; positions to the minute on the 6371 km sphere,
        integers in 1/scale degree. m works as for /api/public/sky/starlink/. Cache-Control public, max-age=60.
      security: []
      parameters:
        - { name: g, in: query, required: true, schema: { $ref: "#/components/schemas/SpaceGroup" } }
        - { name: m, in: query, schema: { type: integer }, description: "Unix minute, within a few minutes of now" }
      responses:
        "200":
          description: "{g, t, step, count, scale, lat, lon, lat1, lon1, alt, norad, v, epoch_age_h, available, stale, fetched_age_h, source}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: The element sets are not available yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/public/sky/space/meta/:
    get:
      operationId: getSpaceObjectsMeta
      tags: [public]
      summary: Names and facts of a space group's objects (SATCAT)
      description: |
        Arrays in the order of the element sets: norad, name, intl (international designator), type (PAY, R/B, DEB,
        UNK), owner (SATCAT owner code), launch (date), size (small, medium, large from the radar cross-section).
        Public for 6 hours when v is the current version (the positions give it), else 60 s.
      security: []
      parameters:
        - { name: g, in: query, required: true, schema: { $ref: "#/components/schemas/SpaceGroup" } }
        - { name: v, in: query, schema: { type: integer } }
      responses:
        "200":
          description: "{v, count, norad, name, intl, type, owner, launch, size}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/public/space/launches/:
    get:
      operationId: listLaunches
      tags: [public]
      summary: Rocket launches of every agency and company, with the warnings of their hazard areas at sea
      description: |
        From Launch Library 2 (The Space Devs, free to use, credit to them), refreshed hourly by the site; never
        fetched for a request. Default span: net from 7 days ago to 60 days ahead, soonest first. warnings lists the
        NAVAREA and coastal warnings the site linked to the launch: launch wording, one of the warning's windows
        holds the launch time and opens within an hour of the launch window, an area within 1,000 nm of the pad,
        and no other launch fits as well. Landings include SpaceX droneships (name; their position is not
        published, downrange_km is) and capsule splashdowns. Cache-Control public, max-age=300.
      security: []
      parameters:
        - { name: from, in: query, schema: { type: string }, description: "Date or ISO time UTC (default 7 days ago)" }
        - { name: to, in: query, schema: { type: string }, description: "Date or ISO time UTC (default 60 days ahead, at most 400 days after from)" }
        - { name: provider, in: query, schema: { type: string, maxLength: 60 }, description: "Part of the provider's name or its abbreviation, e.g. SpaceX, CASC, ISRO" }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: |
            {launches: [{id, name, mission, mission_type, orbit, rocket, provider, provider_abbrev, provider_type,
            agencies, status, status_name, net, net_precision, window_start, window_end,
            pad: {name, location, country, lat, lon},
            landings: [{stage, serial, attempt, success, place, abbrev, lat, lon, downrange_km, type, when, spacecraft?}],
            warnings: [{scope, region_id, region, number, title, headline, url, archived, distance_nm, window_start,
            window_end}]}], count, from, to, generated, source, terms}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/public/space/launches/{id}/:
    get:
      operationId: getLaunch
      tags: [public]
      summary: One launch (the Launch Library 2 id) with its hazard warnings
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "The list's launch plus description, line (the warning page's line) and updated"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/public/space/reentries/:
    get:
      operationId: listReentries
      tags: [public]
      summary: Re-entry predictions (Space-Track TIP), when the site's Space-Track account is set
      description: |
        {available: false} until then. Otherwise the newest TIP message per object with a predicted re-entry from 3
        days ago on: lat and lon are the predicted point at decay_utc; the object may come down anywhere along its
        track within plus or minus window_min minutes. Source Space-Track.org (USSPACECOM). Public, max-age=300.
      security: []
      responses:
        "200":
          description: "{available, reentries: [{norad, name, intl, type, country, decay_utc, window_min, lat, lon, direction, high_interest, message_utc}], source}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
  /api/public/aton-faults/:
    get:
      operationId: listAtonFaults
      tags: [public]
      summary: Lights and buoys out of order in Finnish waters (Fintraffic Digitraffic), not yet repaired
      description: |
        Fetched by the site from Fintraffic Digitraffic every 10 minutes; never fetched for a request. Faults still
        open, sea and inland, in English; names of marks and fairways are Finnish, name_sv / fairway_sv the Swedish
        name when it differs. Licence CC BY 4.0: show credit with its link wherever the data is shown or passed on.
        Cache-Control public, max-age=600.
      security: []
      responses:
        "200":
          description: |
            {faults: [{id, lat, lon, fault, since, name, name_sv, aton_type, aton_id, fairway, fairway_sv, fairway_no,
            area}], count, updated_at, data_at, available, credit: {source, credit, url, licence, licence_url,
            source_words, licence_words, changes}, credits, source, source_url, note}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
  /api/public/winter-navigation/:
    get:
      operationId: getWinterNavigation
      tags: [public]
      summary: Baltic winter navigation now (Finnish-Swedish icebreaker service, via Fintraffic Digitraffic)
      description: |
        Ports and fairways with an assistance restriction or suspension in force (now true) or announced; a
        restriction such as "IA 2000" or "IC 1300 / II 2000" means icebreaker assistance only for ships of at least
        that ice class and deadweight in tonnes; a suspension with closed true closes the port. Icebreakers with
        what each is doing (doing: LED lead, TOW tow, LOC local icebreaking, MOVE, TRANS, STOP, WAIT, OUT, CREWA,
        CREWP, ORDER), the ships planned next (queue) and the latest AIS position; ships waiting for assistance;
        dirways, the routes icebreakers publish through the ice ([lat, lon] points). Out of season the lists are
        empty and active is false. Fetched by the site every 10 minutes; licence CC BY 4.0, show credit.
        Cache-Control public, max-age=60.
      security: []
      responses:
        "200":
          description: |
            {ports: [{name, kind, country, locodes, winterport, lat, lon, port_slug, closed_now,
            restrictions: [{text, start, end, now}], suspensions: [{start, end, now, closed, due, due_text, spec,
            prenotified}]}], icebreakers: [{name, imo, mmsi, call_sign, short, doing, activities: [{type, text, start,
            end, now, assisted, assisting, reason, comment}], queue: [{position, start, end, assisted, assisting}],
            lat, lon, sog, cog, hdg, position_at}], waiting: [{name, imo, mmsi, since}],
            dirways: [{name, description, points}], active, updated_at, available, credit, credits, source,
            source_url, note}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
  /api/public/api-connect/:
    get:
      operationId: listApiConnections
      tags: [public]
      summary: Ready connections for editors, agents, programs and tools, with YOUR_KEY in place of the key
      description: |
        Editor install links (Cursor, VS Code), agent commands and config files, importable n8n and Node-RED flows,
        a Home Assistant sensor, Power Query for Excel and Power BI, Apps Script for Google Sheets, code, a block for
        any ERP and the GitHub route-check workflow. Without `system` every system is listed.
        Systems: cursor, vscode, vscode_insiders, claude_code, claude_desktop, windsurf, zed, chatgpt_gpt, openai_tools, curl, python, javascript, powershell, excel_powerquery, power_bi, google_sheets, zapier, make, n8n, node_red, home_assistant, erp_generic, github_action.
      security: []
      parameters:
        - { name: system, in: query, schema: { type: string }, description: "One system; omit for all" }
        - { name: path, in: query, schema: { type: string }, description: "Where sealagom_mcp.py is on your computer (editor links)" }
      responses:
        "200":
          description: "{systems: [{system, title, group, kind, body, note, href?, filename?, download_url?}], groups, openapi, mcp_file, mcp_path, key_filled}"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/next-auth/api-connect/{token_id}/:
    get:
      operationId: listMyApiConnections
      tags: [public]
      summary: The same connections with your own key filled in (signed-in session on sealagom.com, not the API key)
      security: []
      parameters:
        - { name: token_id, in: path, required: true, schema: { type: integer } }
        - { name: system, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: "As /api/public/api-connect/, with key_filled true, never cached"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
